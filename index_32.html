<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2d3748">
<title>DataMed - Tu carpeta médica</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#2d3748;
    --primary-dark:#1a202c;
    --primary-light:#f3f4f6;
    --accent:#ef4444;
    --accent-dark:#dc2626;
    --bg:#fafbfc;
    --card-bg:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --border:#e5e7eb;
    --danger:#dc2626;
    --danger-bg:#fee2e2;
    --radius:16px;
    --pill-bg:#f3f4f6;
    --pill-text:#2d3748;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f172a;
      --card-bg:#1e293b;
      --text:#f1f5f9;
      --muted:#9ca3af;
      --border:#334155;
      --primary-light:#2d3748;
      --danger-bg:#7f1d1d;
      --pill-bg:#2d3748;
      --pill-text:#f3f4f6;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:120px;
  }
  .header{
    background:linear-gradient(135deg,#2d3748 0%,#ef4444 100%);
    color:#fff;
    padding:calc(20px + env(safe-area-inset-top)) 20px 24px;
    position:sticky;
    top:0;
    z-index:5;
    box-shadow:0 4px 16px rgba(0,0,0,.12);
    border-radius:0 0 22px 22px;
  }
  .header h1{margin:0;font-size:1.4rem;font-weight:800;display:flex;align-items:center;gap:12px;font-family:'Montserrat',sans-serif;letter-spacing:-0.3px;}
  .pulse-icon{display:inline-block;animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.18);}}
  .header-sub{opacity:.92;font-size:.9rem;margin-top:4px;}
  .person-header-row{display:flex;align-items:center;gap:14px;margin-top:14px;}
  .person-header-row h1{margin:0;font-size:1.35rem;}
  .header .pill{background:rgba(255,255,255,.22);color:#fff;}
  .back-btn{
    background:rgba(255,255,255,.18);
    border:none;
    color:#fff;
    padding:8px 14px;
    border-radius:20px;
    font-size:.95rem;
    margin-bottom:10px;
    cursor:pointer;
    min-height:40px;
  }
  .back-btn:active{background:rgba(255,255,255,.3);}
  .content{padding:16px;}
  .section-title{
    font-size:.85rem;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--muted);
    margin:8px 4px 12px;
    font-weight:600;
  }
  .empty{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    line-height:1.6;
  }
  .card{
    background:var(--card-bg);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    border:1px solid var(--border);
    transition:transform .12s ease;
  }
  .person-card{
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
  }
  .person-card:active{transform:scale(.98);}
  .avatar{
    flex-shrink:0;
    width:52px;
    height:52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-weight:700;
    font-size:1.15rem;
    box-shadow:0 2px 6px rgba(0,0,0,.2);
  }
  .avatar.avatar-lg{width:64px;height:64px;font-size:1.4rem;}
  .card-main{flex:1;min-width:0;}
  .card-title{font-weight:700;font-size:1.05rem;word-break:break-word;}
  .card-subtitle{color:var(--muted);font-size:.88rem;margin-top:3px;}
  .card-meta{color:#ef4444;font-size:.82rem;margin-top:5px;font-weight:600;}
  .card-actions{display:flex;gap:6px;flex-shrink:0;}
  .pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .pill{
    background:var(--pill-bg);
    color:var(--pill-text);
    border-radius:999px;
    padding:3px 10px;
    font-size:.78rem;
    font-weight:600;
    white-space:nowrap;
  }
  .icon-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    background:var(--bg);
    font-size:1.1rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon-btn:active{transform:scale(.92);}
  .icon-btn.danger{background:var(--danger-bg);}
  .accordion-group{
    margin-bottom:12px;
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--border);
    background:var(--card-bg);
  }
  .accordion-header{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 16px;
    background:#f3f4f6;
    border:none;
    text-align:left;
    font-size:1rem;
    font-weight:600;
    color:var(--text);
    cursor:pointer;
  }
  .chevron{width:16px;color:#2d3748;font-size:.8rem;}
  .spec-icon{font-size:1.2rem;}
  .spec-name{flex:1;}
  .badge{
    background:linear-gradient(135deg,#ef4444,#dc2626);
    color:#fff;
    border-radius:12px;
    padding:2px 10px;
    font-size:.78rem;
    font-weight:700;
  }
  .accordion-body{padding:12px;}
  .accordion-body.hidden{display:none;}
  .visit-card{cursor:pointer;}
  .visit-row{display:flex;align-items:center;gap:10px;}
  .visit-details{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--border);
  }
  .detail-row{margin-bottom:8px;font-size:.92rem;line-height:1.5;}
  .detail-label{font-weight:700;color:#2d3748;display:block;margin-bottom:6px;font-size:.85rem;}
  .no-docs{color:var(--muted);font-size:.88rem;margin-bottom:10px;}
  .doc-row{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:4px 0 10px;
  }
  .doc-thumb-wrap{
    position:relative;
    flex-shrink:0;
    width:80px;
    height:80px;
  }
  .doc-thumb{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:10px;
    border:1px solid var(--border);
    cursor:pointer;
    display:block;
  }
  .doc-delete-btn{
    position:absolute;
    top:-6px;
    right:-6px;
    width:28px;
    height:28px;
    border-radius:50%;
    border:2px solid var(--card-bg);
    background:var(--danger);
    color:#fff;
    font-size:.75rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .doc-type-tag{
    display:inline-block;
    font-size:.7rem;
    font-weight:700;
    padding:2px 6px;
    border-radius:4px;
    margin-top:4px;
    text-transform:uppercase;
  }
  .doc-type-tag.orden{background:#fee2e2;color:#991b1b;}
  .doc-type-tag.receta{background:#f3f4f6;color:#2d3748;}
  .doc-type-tag.boleta{background:#fef3c7;color:#92400e;}
  .btn-secondary,.btn-primary{
    border:none;
    border-radius:10px;
    padding:12px 18px;
    font-size:.95rem;
    font-weight:600;
    cursor:pointer;
    min-height:44px;
  }
  .btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border);}
  .btn-primary{background:#ef4444;color:#fff;}
  .btn-primary:active{background:#dc2626;}
  .add-doc-btn{width:100%;}
  .fab{
    position:fixed;
    right:20px;
    bottom:calc(100px + env(safe-area-inset-bottom));
    width:60px;
    height:60px;
    border-radius:50%;
    background:linear-gradient(135deg,#ef4444,#dc2626);
    color:#fff;
    border:none;
    font-size:2rem;
    line-height:1;
    box-shadow:0 4px 14px rgba(239,68,68,.3);
    cursor:pointer;
    z-index:10;
  }
  .fab:active{transform:scale(.92);}
  .tab-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:var(--card-bg);
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-around;
    z-index:20;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tab-btn{
    flex:1;
    border:none;
    background:none;
    color:var(--muted);
    font-size:.75rem;
    font-weight:600;
    padding:12px 8px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .tab-btn.active{color:#ef4444;border-top:3px solid #ef4444;}
  .tab-icon{font-size:1.3rem;}
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
  }
  @media (min-width:640px){
    .modal-overlay{align-items:center;}
  }
  .modal{
    background:var(--card-bg);
    width:100%;
    max-width:520px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
  }
  @media (min-width:640px){
    .modal{border-radius:20px;}
  }
  .modal-header{font-size:1.2rem;font-weight:700;margin-bottom:16px;}
  .modal-body label{
    display:block;
    font-size:.85rem;
    font-weight:600;
    color:var(--muted);
    margin:14px 0 6px;
  }
  .modal-body input,.modal-body select,.modal-body textarea{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:1rem;
    font-family:inherit;
  }
  .modal-body textarea{resize:vertical;min-height:70px;}
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:22px;
  }
  .modal-actions button{flex:1;}
  .lightbox{
    background:var(--card-bg);
    border-radius:16px;
    padding:16px;
    max-width:90vw;
    max-height:90vh;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .lightbox-img{
    max-width:100%;
    max-height:65vh;
    object-fit:contain;
    border-radius:10px;
    margin:0 auto;
  }
  .lightbox-actions{display:flex;gap:10px;}
  .lightbox-actions button{flex:1;}
</style>
</head>
<body>
  <div id="app"></div>
  <div id="tabNav"></div>
  <button id="fab" class="fab" aria-label="Agregar" type="button">+</button>
  <div id="modalRoot"></div>
  <input type="file" id="photoInput" accept="image/*" style="display:none">

<script>
(function(){
  "use strict";

  var STORAGE_KEY = 'datamed_db_v2';

  var db = loadDB();
  var view = { type: 'inicio' };
  var expandedSpecialties = new Set();
  var expandedVisits = new Set();
  var currentPhotoTarget = null;

  var appEl = document.getElementById('app');
  var tabNavEl = document.getElementById('tabNav');
  var modalRoot = document.getElementById('modalRoot');
  var fab = document.getElementById('fab');
  var photoInput = document.getElementById('photoInput');

  tabNavEl.addEventListener('click', function(e){
    var btn = e.target.closest('.tab-btn');
    if(btn){
      var tabType = btn.dataset.tab;
      view = { type: tabType };
      expandedSpecialties = new Set();
      expandedVisits = new Set();
      render();
    }
  });

  function loadDB(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.people)) return parsed;
      }
    } catch(e){ console.error('Error leyendo datos guardados', e); }
    return { people: [] };
  }

  function saveDB(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      return true;
    } catch(e){
      console.error('Error guardando datos', e);
      alert('No se pudo guardar. El almacenamiento del navegador está lleno. Intenta eliminar documentos antiguos para liberar espacio.');
      return false;
    }
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function esc(str){
    if(str === undefined || str === null) return '';
    return String(str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function hasVal(x){
    return x !== '' && x !== undefined && x !== null;
  }

  function formatDate(dateStr){
    if(!dateStr) return 'Sin fecha';
    var parts = dateStr.split('-');
    if(parts.length !== 3) return esc(dateStr);
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  var AVATAR_COLORS = ['#f97316','#ec4899','#8b5cf6','#0ea5a0','#eab308','#3b82f6','#ef4444','#14b8a6','#a855f7','#059669'];

  function colorForId(id){
    var hash = 0;
    for(var i = 0; i < id.length; i++){ hash = (hash * 31 + id.charCodeAt(i)) >>> 0; }
    return AVATAR_COLORS[hash % AVATAR_COLORS.length];
  }

  function initialsFor(name){
    if(!name || !name.trim()) return '?';
    var parts = name.trim().split(/\s+/);
    var first = parts[0] ? parts[0][0] : '';
    var second = parts.length > 1 ? parts[1][0] : '';
    return (first + second).toUpperCase();
  }

  function sexIcon(sexo){
    if(sexo === 'Masculino') return '♂️ ';
    if(sexo === 'Femenino') return '♀️ ';
    if(sexo === 'Otro') return '⚧️ ';
    return '';
  }

  var SPECIALTY_ICONS = [
    [['cardio'], '🫀'],
    [['dermat'], '🧴'],
    [['pediatr'], '🧒'],
    [['odont', 'dental'], '🦷'],
    [['oftalmo', 'ocular', 'vista'], '👁️'],
    [['traumat', 'ortoped'], '🦴'],
    [['neurolog'], '🧠'],
    [['psicolog', 'psiquiatr', 'mental'], '💭'],
    [['gineco'], '🌸'],
    [['urolog'], '🩺'],
    [['endocrin'], '⚖️'],
    [['nutric'], '🍎'],
    [['kinesio', 'fisioterap', 'fisiatr'], '🤸'],
    [['general', 'familiar'], '🩺'],
    [['emergenc', 'urgenc'], '🚑'],
    [['otorrino', 'oido'], '👂'],
    [['alerg'], '🤧'],
    [['reumato'], '🦵'],
    [['oncolog'], '🎗️'],
    [['nefrolog'], '🫘'],
    [['neumolog', 'respirat', 'pulmon'], '🫁']
  ];

  function iconForSpecialty(name){
    if(!name || name === 'Sin especialidad') return '🗂️';
    var norm = name.toLowerCase();
    if(norm.normalize) norm = norm.normalize('NFD').replace(/[̀-ͯ]/g, '');
    for(var i = 0; i < SPECIALTY_ICONS.length; i++){
      var keywords = SPECIALTY_ICONS[i][0];
      for(var j = 0; j < keywords.length; j++){
        if(norm.indexOf(keywords[j]) !== -1) return SPECIALTY_ICONS[i][1];
      }
    }
    return '📋';
  }

  function sortPeople(people){
    return people.slice().sort(function(a, b){
      var an = (a.name || '').trim();
      var bn = (b.name || '').trim();
      if(!an && bn) return 1;
      if(an && !bn) return -1;
      if(!an && !bn) return 0;
      return an.localeCompare(bn, 'es', { sensitivity: 'base' });
    });
  }

  function compressImage(file, maxDim, quality){
    maxDim = maxDim || 1000;
    quality = quality || 0.72;
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var width = img.width, height = img.height;
          if(width > height && width > maxDim){
            height = Math.round(height * maxDim / width);
            width = maxDim;
          } else if(height >= width && height > maxDim){
            width = Math.round(width * maxDim / height);
            height = maxDim;
          }
          var canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = function(){ reject(new Error('No se pudo leer la imagen')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('No se pudo leer el archivo')); };
      reader.readAsDataURL(file);
    });
  }

  // ---------- Render ----------

  function render(){
    if(view.type === 'inicio'){
      appEl.innerHTML = renderPeopleList();
    } else if(view.type === 'person'){
      appEl.innerHTML = renderPersonDetail(view.personId);
    } else if(view.type === 'ordenes' || view.type === 'recetas' || view.type === 'boletas'){
      appEl.innerHTML = renderDocumentsByType(view.type);
    }
    attachHandlers();
    renderTabNav();
  }

  function renderTabNav(){
    var tabs = [
      { type: 'inicio', label: 'Inicio', icon: '👪' },
      { type: 'ordenes', label: 'Órdenes', icon: '📋' },
      { type: 'recetas', label: 'Recetas', icon: '💊' },
      { type: 'boletas', label: 'Boletas', icon: '💳' }
    ];
    var html = '<nav class="tab-nav">' + tabs.map(function(tab){
      var active = view.type === tab.type ? ' active' : '';
      return '<button class="tab-btn' + active + '" data-tab="' + tab.type + '" type="button"><span class="tab-icon">' + tab.icon + '</span><span>' + tab.label + '</span></button>';
    }).join('') + '</nav>';
    tabNavEl.innerHTML = html;
  }

  function renderPeopleList(){
    var people = sortPeople(db.people);
    var itemsHtml;
    if(people.length === 0){
      itemsHtml = '<div class="empty">👪<br>No hay personas registradas.<br>Toca el botón + para agregar la primera persona.</div>';
    } else {
      itemsHtml = people.map(function(p){
        var pills = [];
        if(p.sexo) pills.push('<span class="pill">' + sexIcon(p.sexo) + esc(p.sexo) + '</span>');
        if(hasVal(p.edad)) pills.push('<span class="pill">🎂 ' + esc(p.edad) + ' años</span>');
        if(hasVal(p.peso)) pills.push('<span class="pill">⚖️ ' + esc(p.peso) + ' kg</span>');
        if(hasVal(p.estatura)) pills.push('<span class="pill">📏 ' + esc(p.estatura) + ' cm</span>');
        var pillsHtml = pills.length ? '<div class="pill-row">' + pills.join('') + '</div>' : '<div class="card-subtitle">Sin datos adicionales</div>';
        var visitCount = p.visits.length;
        return '' +
        '<div class="card person-card" data-person-id="' + p.id + '">' +
          '<div class="avatar" style="background:' + colorForId(p.id) + '">' + initialsFor(p.name) + '</div>' +
          '<div class="card-main">' +
            '<div class="card-title">' + (esc(p.name) || 'Persona sin nombre') + '</div>' +
            pillsHtml +
            '<div class="card-meta">🗓️ ' + visitCount + ' visita' + (visitCount === 1 ? '' : 's') + ' médica' + (visitCount === 1 ? '' : 's') + '</div>' +
          '</div>' +
          '<div class="card-actions">' +
            '<button class="icon-btn edit-person-btn" data-id="' + p.id + '" aria-label="Editar persona" type="button">✏️</button>' +
            '<button class="icon-btn danger delete-person-btn" data-id="' + p.id + '" aria-label="Eliminar persona" type="button">🗑️</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }
    return '' +
    '<div class="header">' +
      '<h1 style="gap:12px;"><span class="pulse-icon">🩺</span> DataMed</h1>' +
      '<div class="header-sub">Centraliza. Comparte. Controla.</div>' +
    '</div>' +
    '<div class="content">' + itemsHtml + '</div>';
  }

  function renderPersonDetail(personId){
    var person = db.people.filter(function(p){ return p.id === personId; })[0];
    if(!person){
      view = { type: 'inicio' };
      return renderPeopleList();
    }
    var groups = {};
    person.visits.forEach(function(v){
      var key = (v.specialty && v.specialty.trim()) ? v.specialty.trim() : 'Sin especialidad';
      if(!groups[key]) groups[key] = [];
      groups[key].push(v);
    });
    var specialtyNames = Object.keys(groups).sort(function(a, b){
      if(a === 'Sin especialidad') return 1;
      if(b === 'Sin especialidad') return -1;
      return a.localeCompare(b, 'es');
    });

    var groupsHtml;
    if(specialtyNames.length === 0){
      groupsHtml = '<div class="empty">📋<br>No hay visitas registradas.<br>Toca el botón + para agregar una visita.</div>';
    } else {
      groupsHtml = specialtyNames.map(function(spec){
        var visits = groups[spec].slice().sort(function(a, b){
          return (b.date || '').localeCompare(a.date || '');
        });
        var isOpen = expandedSpecialties.has(spec);
        var visitsHtml = visits.map(function(v){ return renderVisitCard(v, person.id); }).join('');
        return '' +
        '<div class="accordion-group">' +
          '<button class="accordion-header" data-spec="' + esc(spec) + '" type="button">' +
            '<span class="chevron">' + (isOpen ? '▼' : '▶') + '</span>' +
            '<span class="spec-icon">' + iconForSpecialty(spec) + '</span>' +
            '<span class="spec-name">' + esc(spec) + '</span>' +
            '<span class="badge">' + visits.length + '</span>' +
          '</button>' +
          '<div class="accordion-body' + (isOpen ? '' : ' hidden') + '">' + visitsHtml + '</div>' +
        '</div>';
      }).join('');
    }

    var personPills = [];
    if(person.sexo) personPills.push('<span class="pill">' + sexIcon(person.sexo) + esc(person.sexo) + '</span>');
    if(hasVal(person.edad)) personPills.push('<span class="pill">🎂 ' + esc(person.edad) + ' años</span>');
    if(hasVal(person.peso)) personPills.push('<span class="pill">⚖️ ' + esc(person.peso) + ' kg</span>');
    if(hasVal(person.estatura)) personPills.push('<span class="pill">📏 ' + esc(person.estatura) + ' cm</span>');
    var personPillsHtml = personPills.length ? '<div class="pill-row">' + personPills.join('') + '</div>' : '<div class="header-sub">Sin datos adicionales</div>';

    return '' +
    '<div class="header">' +
      '<button id="backBtn" class="back-btn" type="button">&larr; Volver</button>' +
      '<div class="person-header-row">' +
        '<div class="avatar avatar-lg" style="background:' + colorForId(person.id) + '">' + initialsFor(person.name) + '</div>' +
        '<div>' +
          '<h1>' + (esc(person.name) || 'Persona sin nombre') + '</h1>' +
          personPillsHtml +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="content">' +
      '<div class="section-title">Visitas médicas</div>' +
      groupsHtml +
    '</div>';
  }

  function renderDocumentsByType(docType){
    var docTypeLabel = docType === 'ordenes' ? 'Órdenes' : docType === 'recetas' ? 'Recetas' : 'Boletas';
    var singularType = docType === 'ordenes' ? 'orden' : docType === 'recetas' ? 'receta' : 'boleta';
    var allDocs = [];
    db.people.forEach(function(person){
      person.visits.forEach(function(visit){
        if(visit.documents){
          visit.documents.forEach(function(doc){
            if(doc.type === singularType){
              allDocs.push({
                doc: doc,
                visit: visit,
                person: person
              });
            }
          });
        }
      });
    });

    var groupsByPerson = {};
    allDocs.forEach(function(item){
      var pkey = item.person.id;
      if(!groupsByPerson[pkey]) groupsByPerson[pkey] = {
        person: item.person,
        bySpec: {}
      };
      var spec = item.visit.specialty || 'Sin especialidad';
      if(!groupsByPerson[pkey].bySpec[spec]) groupsByPerson[pkey].bySpec[spec] = [];
      groupsByPerson[pkey].bySpec[spec].push(item);
    });

    var sortedPeople = sortPeople(Object.keys(groupsByPerson).map(function(k){ return groupsByPerson[k].person; }));

    var groupsHtml;
    if(allDocs.length === 0){
      groupsHtml = '<div class="empty">📋<br>No hay ' + docTypeLabel.toLowerCase() + ' registradas.</div>';
    } else {
      groupsHtml = sortedPeople.map(function(person){
        var personGroup = groupsByPerson[person.id];
        var specs = Object.keys(personGroup.bySpec).sort();
        var specsHtml = specs.map(function(spec){
          var items = personGroup.bySpec[spec];
          var isOpen = expandedSpecialties.has(person.id + ':' + spec);
          var docsHtml = items.map(function(item){
            return renderDocumentItem(item.doc, person.id, item.visit.id);
          }).join('');
          return '' +
          '<div class="accordion-group">' +
            '<button class="accordion-header" data-spec="' + esc(person.id + ':' + spec) + '" type="button">' +
              '<span class="chevron">' + (isOpen ? '▼' : '▶') + '</span>' +
              '<span class="spec-icon">' + iconForSpecialty(spec) + '</span>' +
              '<span class="spec-name">' + esc(spec) + '</span>' +
              '<span class="badge">' + items.length + '</span>' +
            '</button>' +
            '<div class="accordion-body' + (isOpen ? '' : ' hidden') + '">' + docsHtml + '</div>' +
          '</div>';
        }).join('');
        return '' +
        '<div style="margin-bottom:20px;">' +
          '<div style="display:flex;align-items:center;gap:8px;margin:12px 0 8px;padding:0 4px;">' +
            '<div class="avatar" style="background:' + colorForId(person.id) + ';width:40px;height:40px;font-size:0.9rem;">' + initialsFor(person.name) + '</div>' +
            '<div style="font-weight:700;color:var(--text);">' + esc(person.name) + '</div>' +
          '</div>' +
          specsHtml +
        '</div>';
      }).join('');
    }

    var headerIcon = docType === 'ordenes' ? '📋' : docType === 'recetas' ? '💊' : '💳';
    return '' +
    '<div class="header">' +
      '<h1 style="font-weight:800;letter-spacing:-0.5px;">' + headerIcon + ' ' + docTypeLabel + '</h1>' +
      '<div class="header-sub">Organizadas por persona y especialidad</div>' +
    '</div>' +
    '<div class="content">' + groupsHtml + '</div>';
  }

  function renderVisitCard(v, personId){
    var isOpen = expandedVisits.has(v.id);
    var dateDisplay = formatDate(v.date);
    var doctorDisplay = v.doctor ? esc(v.doctor) : 'Sin doctor';
    var diagnosisPreview = v.diagnosis ? esc(v.diagnosis).slice(0, 90) : 'Sin diagnóstico registrado';

    var detailsHtml = '';
    if(isOpen){
      var docsHtml = '';
      ['orden', 'receta', 'boleta'].forEach(function(dtype){
        var docs = v.documents ? v.documents.filter(function(d){ return d.type === dtype; }) : [];
        if(docs.length){
          docsHtml += '<div style="margin-top:12px;">' +
            '<span class="detail-label">' + (dtype === 'orden' ? 'Órdenes' : dtype === 'receta' ? 'Recetas' : 'Boletas') + '</span>' +
            '<div class="doc-row">' + docs.map(function(d){
              return '' +
              '<div class="doc-thumb-wrap" data-doc-id="' + d.id + '" data-visit-id="' + v.id + '" data-person-id="' + personId + '">' +
                '<img src="' + d.dataUrl + '" class="doc-thumb view-doc-btn" alt="Documento">' +
                '<button class="doc-delete-btn" aria-label="Eliminar documento" type="button">🗑️</button>' +
              '</div>';
            }).join('') + '</div>' +
          '</div>';
        }
      });
      if(!docsHtml){
        docsHtml = '<div class="no-docs">Sin documentos adjuntos</div>';
      }
      detailsHtml = '' +
      '<div class="visit-details">' +
        '<div class="detail-row"><span class="detail-label">Centro de salud</span>' + (v.healthCenter ? esc(v.healthCenter) : '—') + '</div>' +
        '<div class="detail-row"><span class="detail-label">Diagnóstico</span>' + (v.diagnosis ? esc(v.diagnosis) : '—') + '</div>' +
        '<div class="detail-row"><span class="detail-label">Remedios / Tratamiento</span>' + (v.remedies ? esc(v.remedies) : '—') + '</div>' +
        docsHtml +
        '<button class="btn-secondary add-doc-btn" data-visit-id="' + v.id + '" data-person-id="' + personId + '" type="button">📷 Agregar documento</button>' +
      '</div>';
    }

    return '' +
    '<div class="card visit-card" data-visit-id="' + v.id + '" data-person-id="' + personId + '">' +
      '<div class="visit-row">' +
        '<div class="card-main">' +
          '<div class="card-title">📅 ' + dateDisplay + ' &middot; 🩺 ' + doctorDisplay + '</div>' +
          '<div class="card-subtitle">' + (v.healthCenter ? '🏥 ' + esc(v.healthCenter) + ' &middot; ' : '') + diagnosisPreview + '</div>' +
        '</div>' +
        '<div class="card-actions">' +
          '<button class="icon-btn edit-visit-btn" data-visit-id="' + v.id + '" data-person-id="' + personId + '" aria-label="Editar visita" type="button">✏️</button>' +
          '<button class="icon-btn danger delete-visit-btn" data-visit-id="' + v.id + '" data-person-id="' + personId + '" aria-label="Eliminar visita" type="button">🗑️</button>' +
        '</div>' +
      '</div>' +
      detailsHtml +
    '</div>';
  }

  function renderDocumentItem(doc, personId, visitId){
    return '' +
    '<div class="card" style="position:relative;">' +
      '<div style="display:flex;gap:10px;align-items:flex-start;">' +
        '<img src="' + doc.dataUrl + '" style="width:60px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer;" class="view-doc-btn" data-doc-id="' + doc.id + '" data-visit-id="' + visitId + '" data-person-id="' + personId + '" alt="Documento">' +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-weight:600;word-break:break-word;">' + esc(doc.name) + '</div>' +
          '<span class="doc-type-tag ' + doc.type + '">' + doc.type + '</span>' +
        '</div>' +
        '<button class="icon-btn danger doc-delete-btn" data-doc-id="' + doc.id + '" data-visit-id="' + visitId + '" data-person-id="' + personId + '" aria-label="Eliminar" type="button" style="flex-shrink:0;">🗑️</button>' +
      '</div>' +
    '</div>';
  }

  // ---------- Event handling ----------

  function attachHandlers(){
    fab.onclick = function(){
      if(view.type === 'inicio'){
        openPersonModal(null);
      } else if(view.type === 'person'){
        openVisitModal(view.personId, null);
      }
    };

    if(view.type === 'inicio'){
      qa('.person-card').forEach(function(card){
        card.addEventListener('click', function(){
          view = { type: 'person', personId: card.dataset.personId };
          expandedSpecialties = new Set();
          expandedVisits = new Set();
          render();
        });
      });
      qa('.edit-person-btn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          openPersonModal(btn.dataset.id);
        });
      });
      qa('.delete-person-btn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          if(confirm('¿Eliminar esta persona y todo su historial médico? Esta acción no se puede deshacer.')){
            db.people = db.people.filter(function(p){ return p.id !== btn.dataset.id; });
            saveDB();
            render();
          }
        });
      });
    } else if(view.type === 'person'){
      var backBtn = document.getElementById('backBtn');
      if(backBtn){
        backBtn.addEventListener('click', function(){
          view = { type: 'inicio' };
          render();
        });
      }
      qa('.accordion-header').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          var spec = btn.dataset.spec;
          if(expandedSpecialties.has(spec)) expandedSpecialties.delete(spec);
          else expandedSpecialties.add(spec);
          render();
        });
      });
      qa('.visit-card').forEach(function(card){
        card.addEventListener('click', function(){
          var vid = card.dataset.visitId;
          if(expandedVisits.has(vid)) expandedVisits.delete(vid);
          else expandedVisits.add(vid);
          render();
        });
      });
      qa('.edit-visit-btn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          openVisitModal(btn.dataset.personId, btn.dataset.visitId);
        });
      });
      qa('.delete-visit-btn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          if(confirm('¿Eliminar esta visita médica?')){
            var person = db.people.filter(function(p){ return p.id === btn.dataset.personId; })[0];
            person.visits = person.visits.filter(function(v){ return v.id !== btn.dataset.visitId; });
            saveDB();
            render();
          }
        });
      });
      qa('.add-doc-btn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          currentPhotoTarget = { mode: 'existing', personId: btn.dataset.personId, visitId: btn.dataset.visitId };
          photoInput.value = '';
          photoInput.click();
        });
      });
      qa('.doc-delete-btn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          if(confirm('¿Eliminar este documento?')){
            var person = db.people.filter(function(p){ return p.id === btn.dataset.personId; })[0];
            var visit = person.visits.filter(function(v){ return v.id === btn.dataset.visitId; })[0];
            visit.documents = visit.documents.filter(function(d){ return d.id !== btn.dataset.docId; });
            saveDB();
            render();
          }
        });
      });
      qa('.view-doc-btn').forEach(function(img){
        img.addEventListener('click', function(e){
          e.stopPropagation();
          var person = db.people.filter(function(p){ return p.id === this.dataset.personId; })[0];
          var visit = person.visits.filter(function(v){ return v.id === this.dataset.visitId; })[0];
          var doc = visit.documents.filter(function(d){ return d.id === this.dataset.docId; })[0];
          openLightbox(doc.dataUrl, doc.name);
        }.bind(img));
      });
    } else if(view.type === 'ordenes' || view.type === 'recetas' || view.type === 'boletas'){
      qa('.accordion-header').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          var spec = btn.dataset.spec;
          if(expandedSpecialties.has(spec)) expandedSpecialties.delete(spec);
          else expandedSpecialties.add(spec);
          render();
        });
      });
      qa('.doc-delete-btn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          if(confirm('¿Eliminar este documento?')){
            var person = db.people.filter(function(p){ return p.id === btn.dataset.personId; })[0];
            var visit = person.visits.filter(function(v){ return v.id === btn.dataset.visitId; })[0];
            visit.documents = visit.documents.filter(function(d){ return d.id !== btn.dataset.docId; });
            saveDB();
            render();
          }
        });
      });
      qa('.view-doc-btn').forEach(function(img){
        img.addEventListener('click', function(e){
          e.stopPropagation();
          var person = db.people.filter(function(p){ return p.id === this.dataset.personId; })[0];
          var visit = person.visits.filter(function(v){ return v.id === this.dataset.visitId; })[0];
          var doc = visit.documents.filter(function(d){ return d.id === this.dataset.docId; })[0];
          openLightbox(doc.dataUrl, doc.name);
        }.bind(img));
      });
    }
  }

  function qa(sel){
    return Array.prototype.slice.call(appEl.querySelectorAll(sel));
  }

  photoInput.addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    if(!file.type || file.type.indexOf('image/') !== 0){
      alert('Por favor selecciona un archivo de imagen.');
      return;
    }
    compressImage(file).then(function(dataUrl){
      var target = currentPhotoTarget;
      if(target.mode === 'pending'){
        openDocTypeChooser(dataUrl, file.name, function(type){
          target.draft.pendingDocs.push({ id: uid(), name: file.name, dataUrl: dataUrl, type: type });
          openVisitModal(target.personId, target.visitId, target.draft);
        });
      } else {
        var person = db.people.filter(function(p){ return p.id === target.personId; })[0];
        var visit = person.visits.filter(function(v){ return v.id === target.visitId; })[0];
        if(!visit.documents) visit.documents = [];
        openDocTypeChooser(dataUrl, file.name, function(type){
          visit.documents.push({ id: uid(), name: file.name, dataUrl: dataUrl, type: type });
          expandedVisits.add(visit.id);
          if(saveDB()){
            closeModal();
            render();
          }
        });
      }
    }).catch(function(err){
      console.error(err);
      alert('No se pudo procesar la imagen.');
    });
  });

  // ---------- Modals ----------

  function closeModal(){
    modalRoot.innerHTML = '';
  }

  function bindModalShell(){
    var cancelBtn = document.getElementById('modalCancel');
    if(cancelBtn) cancelBtn.addEventListener('click', closeModal);
    var overlay = document.getElementById('modalOverlay');
    if(overlay){
      overlay.addEventListener('click', function(e){
        if(e.target.id === 'modalOverlay') closeModal();
      });
    }
  }

  function openPersonModal(personId){
    var person = personId ? db.people.filter(function(p){ return p.id === personId; })[0] : null;
    var isEdit = !!person;
    modalRoot.innerHTML = '' +
    '<div class="modal-overlay" id="modalOverlay">' +
      '<div class="modal">' +
        '<div class="modal-header">' + (isEdit ? 'Editar persona' : 'Agregar persona') + '</div>' +
        '<div class="modal-body">' +
          '<label for="f-name">Nombre</label>' +
          '<input type="text" id="f-name" value="' + (person ? esc(person.name) : '') + '" placeholder="Nombre completo">' +
          '<label for="f-sexo">Sexo</label>' +
          '<select id="f-sexo">' +
            '<option value="">Sin especificar</option>' +
            '<option value="Masculino"' + (person && person.sexo === 'Masculino' ? ' selected' : '') + '>Masculino</option>' +
            '<option value="Femenino"' + (person && person.sexo === 'Femenino' ? ' selected' : '') + '>Femenino</option>' +
            '<option value="Otro"' + (person && person.sexo === 'Otro' ? ' selected' : '') + '>Otro</option>' +
          '</select>' +
          '<label for="f-edad">Edad (años)</label>' +
          '<input type="number" id="f-edad" min="0" max="150" value="' + (person && hasVal(person.edad) ? person.edad : '') + '" placeholder="Ej: 35">' +
          '<label for="f-peso">Peso (kg)</label>' +
          '<input type="number" id="f-peso" min="0" step="0.1" value="' + (person && hasVal(person.peso) ? person.peso : '') + '" placeholder="Ej: 70">' +
          '<label for="f-estatura">Estatura (cm)</label>' +
          '<input type="number" id="f-estatura" min="0" step="0.1" value="' + (person && hasVal(person.estatura) ? person.estatura : '') + '" placeholder="Ej: 170">' +
        '</div>' +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="modalCancel" type="button">Cancelar</button>' +
          '<button class="btn-primary" id="modalSave" type="button">Guardar</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    bindModalShell();
    document.getElementById('modalSave').addEventListener('click', function(){
      var name = document.getElementById('f-name').value.trim();
      var sexo = document.getElementById('f-sexo').value;
      var edadVal = document.getElementById('f-edad').value;
      var pesoVal = document.getElementById('f-peso').value;
      var estaturaVal = document.getElementById('f-estatura').value;
      var data = {
        name: name,
        sexo: sexo || '',
        edad: edadVal === '' ? '' : Number(edadVal),
        peso: pesoVal === '' ? '' : Number(pesoVal),
        estatura: estaturaVal === '' ? '' : Number(estaturaVal)
      };
      if(isEdit){
        Object.assign(person, data);
      } else {
        db.people.push(Object.assign({ id: uid(), visits: [] }, data));
      }
      if(saveDB()){
        closeModal();
        render();
      }
    });
  }

  function openVisitModal(personId, visitId, draft){
    var person = db.people.filter(function(p){ return p.id === personId; })[0];
    if(!person) return;
    var visit = visitId ? person.visits.filter(function(v){ return v.id === visitId; })[0] : null;
    var isEdit = !!visit;
    var specialtyOptions = person.visits
      .map(function(v){ return v.specialty; })
      .filter(function(s, i, arr){ return s && arr.indexOf(s) === i; });
    var healthCenterOptions = person.visits
      .map(function(v){ return v.healthCenter; })
      .filter(function(s, i, arr){ return s && arr.indexOf(s) === i; });

    var fieldVals = draft || {
      specialty: visit ? (visit.specialty || '') : '',
      doctor: visit ? (visit.doctor || '') : '',
      healthCenter: visit ? (visit.healthCenter || '') : '',
      date: visit && visit.date ? visit.date : '',
      diagnosis: visit ? (visit.diagnosis || '') : '',
      remedies: visit ? (visit.remedies || '') : ''
    };
    var pendingDocs = (draft && draft.pendingDocs) ? draft.pendingDocs : [];

    var pendingDocsHtml = '';
    if(pendingDocs.length){
      pendingDocsHtml = '<div class="doc-row" style="margin-bottom:10px;">' + pendingDocs.map(function(d){
        return '' +
        '<div class="doc-thumb-wrap" data-pending-id="' + d.id + '" style="position:relative;">' +
          '<img src="' + d.dataUrl + '" class="doc-thumb" alt="Documento">' +
          '<span class="doc-type-tag ' + d.type + '" style="position:absolute;bottom:4px;left:4px;">' + d.type + '</span>' +
          '<button class="doc-delete-btn pending-doc-delete" data-pending-id="' + d.id + '" aria-label="Eliminar documento" type="button">🗑️</button>' +
        '</div>';
      }).join('') + '</div>';
    }

    modalRoot.innerHTML = '' +
    '<div class="modal-overlay" id="modalOverlay">' +
      '<div class="modal">' +
        '<div class="modal-header">' + (isEdit ? 'Editar visita' : 'Agregar visita') + '</div>' +
        '<div class="modal-body">' +
          '<label for="f-specialty">Especialidad</label>' +
          '<input type="text" id="f-specialty" list="specialtyList" value="' + esc(fieldVals.specialty) + '" placeholder="Ej: Cardiología">' +
          '<datalist id="specialtyList">' + specialtyOptions.map(function(s){ return '<option value="' + esc(s) + '">'; }).join('') + '</datalist>' +
          '<label for="f-doctor">Doctor/a</label>' +
          '<input type="text" id="f-doctor" value="' + esc(fieldVals.doctor) + '" placeholder="Nombre del doctor">' +
          '<label for="f-healthCenter">Centro de salud</label>' +
          '<input type="text" id="f-healthCenter" list="healthCenterList" value="' + esc(fieldVals.healthCenter) + '" placeholder="Ej: Clínica Las Condes">' +
          '<datalist id="healthCenterList">' + healthCenterOptions.map(function(s){ return '<option value="' + esc(s) + '">'; }).join('') + '</datalist>' +
          '<label for="f-date">Fecha</label>' +
          '<input type="date" id="f-date" value="' + fieldVals.date + '">' +
          '<label for="f-diagnosis">Diagnóstico</label>' +
          '<textarea id="f-diagnosis" rows="3" placeholder="Diagnóstico">' + esc(fieldVals.diagnosis) + '</textarea>' +
          '<label for="f-remedies">Remedios / Tratamiento</label>' +
          '<textarea id="f-remedies" rows="3" placeholder="Medicamentos, indicaciones, etc.">' + esc(fieldVals.remedies) + '</textarea>' +
          '<label>Documentos</label>' +
          pendingDocsHtml +
          '<button class="btn-secondary" id="modalAddDoc" type="button">📎 Agregar documento</button>' +
        '</div>' +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="modalCancel" type="button">Cancelar</button>' +
          '<button class="btn-primary" id="modalSave" type="button">Guardar</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    bindModalShell();

    function captureFormValues(){
      return {
        specialty: document.getElementById('f-specialty').value,
        doctor: document.getElementById('f-doctor').value,
        healthCenter: document.getElementById('f-healthCenter').value,
        date: document.getElementById('f-date').value,
        diagnosis: document.getElementById('f-diagnosis').value,
        remedies: document.getElementById('f-remedies').value,
        pendingDocs: pendingDocs
      };
    }

    document.getElementById('modalAddDoc').addEventListener('click', function(){
      currentPhotoTarget = { mode: 'pending', personId: personId, visitId: visitId, draft: captureFormValues() };
      photoInput.value = '';
      photoInput.click();
    });

    Array.prototype.slice.call(modalRoot.querySelectorAll('.pending-doc-delete')).forEach(function(btn){
      btn.addEventListener('click', function(){
        var snapshot = captureFormValues();
        snapshot.pendingDocs = pendingDocs.filter(function(d){ return d.id !== btn.dataset.pendingId; });
        openVisitModal(personId, visitId, snapshot);
      });
    });

    document.getElementById('modalSave').addEventListener('click', function(){
      var data = {
        specialty: document.getElementById('f-specialty').value.trim(),
        doctor: document.getElementById('f-doctor').value.trim(),
        healthCenter: document.getElementById('f-healthCenter').value.trim(),
        date: document.getElementById('f-date').value,
        diagnosis: document.getElementById('f-diagnosis').value.trim(),
        remedies: document.getElementById('f-remedies').value.trim()
      };
      if(isEdit){
        Object.assign(visit, data);
        if(pendingDocs.length){
          if(!visit.documents) visit.documents = [];
          visit.documents = visit.documents.concat(pendingDocs);
          expandedVisits.add(visit.id);
        }
      } else {
        var newVisit = Object.assign({ id: uid(), documents: pendingDocs.slice() }, data);
        person.visits.push(newVisit);
        if(pendingDocs.length) expandedVisits.add(newVisit.id);
      }
      if(saveDB()){
        closeModal();
        render();
      }
    });
  }

  function openDocTypeChooser(dataUrl, filename, onSelect){
    modalRoot.innerHTML = '' +
    '<div class="modal-overlay" id="modalOverlay">' +
      '<div class="modal">' +
        '<div class="modal-header">¿Qué tipo de documento es?</div>' +
        '<div class="modal-body">' +
          '<div style="text-align:center;margin-bottom:16px;">' +
            '<img src="' + dataUrl + '" style="max-width:100%;max-height:150px;border-radius:8px;">' +
          '</div>' +
          '<label>Tipo de documento</label>' +
        '</div>' +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="docType-orden" type="button">📋 Orden</button>' +
          '<button class="btn-secondary" id="docType-receta" type="button">💊 Receta</button>' +
          '<button class="btn-secondary" id="docType-boleta" type="button">💳 Boleta</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    ['orden', 'receta', 'boleta'].forEach(function(type){
      document.getElementById('docType-' + type).addEventListener('click', function(){
        onSelect(type);
      });
    });
  }

  function openLightbox(dataUrl, filename){
    modalRoot.innerHTML = '' +
    '<div class="modal-overlay" id="modalOverlay">' +
      '<div class="lightbox">' +
        '<img src="' + dataUrl + '" class="lightbox-img" alt="Documento">' +
        '<div class="lightbox-actions">' +
          '<button class="btn-secondary" id="lightboxDownload" type="button">⬇️ Descargar</button>' +
          '<button class="btn-primary" id="lightboxClose" type="button">Cerrar</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    document.getElementById('lightboxClose').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', function(e){
      if(e.target.id === 'modalOverlay') closeModal();
    });
    document.getElementById('lightboxDownload').addEventListener('click', function(){
      var a = document.createElement('a');
      a.href = dataUrl;
      a.download = filename || 'documento.jpg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  }

  render();
})();
</script>
</body>
</html>
