<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2d3748">
<title>DataMed - Tu carpeta médica</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#2d3748;
    --primary-dark:#1a202c;
    --primary-light:#f3f4f6;
    --accent:#ef4444;
    --accent-dark:#dc2626;
    --bg:#fafbfc;
    --card-bg:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --border:#e5e7eb;
    --danger:#dc2626;
    --danger-bg:#fee2e2;
    --radius:16px;
    --pill-bg:#f3f4f6;
    --pill-text:#2d3748;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f172a;
      --card-bg:#1e293b;
      --text:#f1f5f9;
      --muted:#9ca3af;
      --border:#334155;
      --primary-light:#2d3748;
      --danger-bg:#7f1d1d;
      --pill-bg:#2d3748;
      --pill-text:#f3f4f6;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:120px;
  }
  .header{
    background:linear-gradient(135deg,#2d3748 0%,#ef4444 100%);
    color:#fff;
    padding:calc(20px + env(safe-area-inset-top)) 20px 24px;
    position:sticky;
    top:0;
    z-index:5;
    box-shadow:0 4px 16px rgba(0,0,0,.12);
    border-radius:0 0 22px 22px;
  }
  .header h1{margin:0;font-size:1.4rem;font-weight:800;display:flex;align-items:center;gap:12px;font-family:'Montserrat',sans-serif;letter-spacing:-0.3px;}
  .pulse-icon{display:inline-block;animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.18);}}
  .header-sub{opacity:.92;font-size:.9rem;margin-top:4px;}
  .person-header-row{display:flex;align-items:center;gap:14px;margin-top:14px;}
  .person-header-row h1{margin:0;font-size:1.35rem;}
  .header .pill{background:rgba(255,255,255,.22);color:#fff;}
  .back-btn{
    background:rgba(255,255,255,.18);
    border:none;
    color:#fff;
    padding:8px 14px;
    border-radius:20px;
    font-size:.95rem;
    margin-bottom:10px;
    cursor:pointer;
    min-height:40px;
  }
  .back-btn:active{background:rgba(255,255,255,.3);}
  .content{padding:16px;}
  .section-title{
    font-size:.85rem;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--muted);
    margin:8px 4px 12px;
    font-weight:600;
  }
  .empty{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    line-height:1.6;
  }
  .card{
    background:var(--card-bg);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    border:1px solid var(--border);
    transition:transform .12s ease;
  }
  .person-card{
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
  }
  .person-card:active{transform:scale(.98);}
  .avatar{
    flex-shrink:0;
    width:52px;
    height:52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-weight:700;
    font-size:1.15rem;
    box-shadow:0 2px 6px rgba(0,0,0,.2);
  }
  .avatar.avatar-lg{width:64px;height:64px;font-size:1.4rem;}
  .card-main{flex:1;min-width:0;}
  .card-title{font-weight:700;font-size:1.05rem;word-break:break-word;}
  .card-subtitle{color:var(--muted);font-size:.88rem;margin-top:3px;}
  .card-meta{color:#ef4444;font-size:.82rem;margin-top:5px;font-weight:600;}
  .card-actions{display:flex;gap:6px;flex-shrink:0;}
  .pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .pill{
    background:var(--pill-bg);
    color:var(--pill-text);
    border-radius:999px;
    padding:3px 10px;
    font-size:.78rem;
    font-weight:600;
    white-space:nowrap;
  }
  .icon-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    background:var(--bg);
    font-size:1.1rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon-btn:active{transform:scale(.92);}
  .icon-btn.danger{background:var(--danger-bg);}
  .accordion-group{
    margin-bottom:12px;
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--border);
    background:var(--card-bg);
  }
  .accordion-header{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 16px;
    background:#f3f4f6;
    border:none;
    text-align:left;
    font-size:1rem;
    font-weight:600;
    color:var(--text);
    cursor:pointer;
  }
  .chevron{width:16px;color:#2d3748;font-size:.8rem;}
  .spec-icon{font-size:1.2rem;}
  .spec-name{flex:1;}
  .badge{
    background:linear-gradient(135deg,#ef4444,#dc2626);
    color:#fff;
    border-radius:12px;
    padding:2px 10px;
    font-size:.78rem;
    font-weight:700;
  }
  .accordion-body{padding:12px;}
  .accordion-body.hidden{display:none;}
  .visit-card{cursor:pointer;}
  .visit-row{display:flex;align-items:center;gap:10px;}
  .visit-details{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--border);
  }
  .detail-row{margin-bottom:8px;font-size:.92rem;line-height:1.5;}
  .detail-label{font-weight:700;color:#2d3748;display:block;margin-bottom:6px;font-size:.85rem;}
  .no-docs{color:var(--muted);font-size:.88rem;margin-bottom:10px;}
  .doc-row{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:4px 0 10px;
  }
  .doc-thumb-wrap{
    position:relative;
    flex-shrink:0;
    width:80px;
    height:80px;
  }
  .doc-thumb{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:10px;
    border:1px solid var(--border);
    cursor:pointer;
    display:block;
  }
  .doc-delete-btn{
    position:absolute;
    top:-6px;
    right:-6px;
    width:28px;
    height:28px;
    border-radius:50%;
    border:2px solid var(--card-bg);
    background:var(--danger);
    color:#fff;
    font-size:.75rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .doc-type-tag{
    display:inline-block;
    font-size:.7rem;
    font-weight:700;
    padding:2px 6px;
    border-radius:4px;
    margin-top:4px;
    text-transform:uppercase;
  }
  .doc-type-tag.orden{background:#fee2e2;color:#991b1b;}
  .doc-type-tag.receta{background:#f3f4f6;color:#2d3748;}
  .doc-type-tag.boleta{background:#fef3c7;color:#92400e;}
  .doc-type-tag.bono{background:#dbeafe;color:#1e40af;}
  .doc-type-grid{flex-wrap:wrap;}
  .doc-type-grid button{flex:1 1 45%;}
  .btn-secondary,.btn-primary{
    border:none;
    border-radius:10px;
    padding:12px 18px;
    font-size:.95rem;
    font-weight:600;
    cursor:pointer;
    min-height:44px;
  }
  .btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border);}
  .btn-primary{background:#ef4444;color:#fff;}
  .btn-primary:active{background:#dc2626;}
  .fab{
    position:fixed;
    right:20px;
    bottom:calc(100px + env(safe-area-inset-bottom));
    width:60px;
    height:60px;
    border-radius:50%;
    background:linear-gradient(135deg,#ef4444,#dc2626);
    color:#fff;
    border:none;
    font-size:2rem;
    line-height:1;
    box-shadow:0 4px 14px rgba(239,68,68,.3);
    cursor:pointer;
    z-index:10;
  }
  .fab:active{transform:scale(.92);}
  .tab-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:var(--card-bg);
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-around;
    z-index:20;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tab-btn{
    flex:1;
    border:none;
    background:none;
    color:var(--muted);
    font-size:.75rem;
    font-weight:600;
    padding:12px 8px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .tab-btn.active{color:#ef4444;border-top:3px solid #ef4444;}
  .tab-icon{font-size:1.3rem;}
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
  }
  @media (min-width:640px){
    .modal-overlay{align-items:center;}
  }
  .modal{
    background:var(--card-bg);
    width:100%;
    max-width:520px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
  }
  @media (min-width:640px){
    .modal{border-radius:20px;}
  }
  .modal-header{font-size:1.2rem;font-weight:700;margin-bottom:16px;}
  .modal-body label{
    display:block;
    font-size:.85rem;
    font-weight:600;
    color:var(--muted);
    margin:14px 0 6px;
  }
  .modal-body input,.modal-body select,.modal-body textarea{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:1rem;
    font-family:inherit;
  }
  .modal-body textarea{resize:vertical;min-height:70px;}
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:22px;
  }
  .modal-actions button{flex:1;}
  .lightbox{
    background:var(--card-bg);
    border-radius:16px;
    padding:16px;
    max-width:90vw;
    max-height:90vh;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .lightbox-img{
    max-width:100%;
    max-height:65vh;
    object-fit:contain;
    border-radius:10px;
    margin:0 auto;
  }
  .lightbox-actions{display:flex;gap:10px;}
  .lightbox-actions button{flex:1;}

  .icon{flex-shrink:0;vertical-align:-4px;}
  .header h1{display:flex;align-items:center;}
  .pulse-icon{display:inline-flex;align-items:center;}
  .tab-btn{display:flex;}
  .tab-icon{display:inline-flex;}
  .card-title,.card-subtitle,.card-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .pill{display:inline-flex;align-items:center;gap:4px;}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;}
  .btn-secondary,.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .accordion-header{display:flex;align-items:center;}
  .spec-icon{display:inline-flex;align-items:center;color:var(--accent);}
  .chevron{display:inline-flex;align-items:center;color:var(--muted);}
  .empty{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);}
  .empty .icon{width:40px;height:40px;}
  /* ---- Reembolsos ---- */
  .pick-visit-btn{width:100%;text-align:left;display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .pick-visit-btn .pv-main{flex:1;min-width:0;}
  .pick-visit-btn .pv-sub{font-size:.78rem;color:var(--muted);font-weight:500;}
  .reemb-actions{display:flex;gap:8px;margin-top:10px;}
  .reemb-actions .reemb-quick{flex:1;padding:10px 12px;min-height:44px;font-size:.88rem;}
  .reemb-actions .reemb-btn{margin-top:0;}
  .reemb-actions .reemb-btn.btn-primary{flex:1;}
  .reemb-banner{display:block;width:100%;text-align:left;border:1px dashed var(--border);background:transparent;color:var(--muted);border-radius:10px;padding:10px 12px;font-size:.82rem;margin-bottom:12px;cursor:pointer;}
  .reemb-attach{font-size:.75rem;color:var(--muted);margin-top:6px;}
  .reemb-actions .reemb-start{flex:1;padding:10px 12px;min-height:44px;font-size:.88rem;}
  .reemb-actions .reemb-hist{flex:1;padding:10px 12px;min-height:44px;font-size:.88rem;}
  .reemb-skip{width:100%;background:none;border:none;color:var(--muted);text-decoration:underline;font-size:.82rem;padding:6px 4px;min-height:36px;cursor:pointer;text-align:center;}
  .reemb-hint{font-size:.78rem;color:var(--muted);margin-top:6px;}
  .tab-btn{font-size:.6rem;letter-spacing:0;padding:12px 1px;min-width:0;}
  .tab-btn{justify-content:flex-start;}
  @media (max-width:340px){ .tab-btn{font-size:.54rem;} }
  .tab-btn span{max-width:100%;text-align:center;line-height:1.15;}
  .filter-row{display:flex;gap:6px;margin:4px 0 12px;}
  .filter-chip{flex:1;border:1px solid var(--border);background:var(--card-bg);color:var(--text);border-radius:999px;padding:8px 6px;font-size:.8rem;font-weight:600;min-height:40px;cursor:pointer;}
  .filter-chip.active{background:#ef4444;border-color:#ef4444;color:#fff;}
  .reemb-summary{display:flex;gap:8px;margin-bottom:12px;}
  .reemb-summary > div{flex:1;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:10px 12px;}
  .reemb-summary .num{font-size:1.1rem;font-weight:800;color:var(--text);}
  .reemb-summary .lbl{font-size:.75rem;color:var(--muted);}
  .reemb-group-title{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 4px 8px;}
  .reemb-block{margin-top:6px;font-size:.85rem;color:var(--muted);}
  .reemb-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;}
  .st{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;}
  .st-pendiente{background:rgba(239,68,68,.15);color:#ef4444;}
  .st-enviado{background:rgba(59,130,246,.15);color:#3b82f6;}
  .st-reembolsado{background:rgba(34,197,94,.15);color:#16a34a;}
  .st-rechazado{background:rgba(107,114,128,.2);color:var(--muted);text-decoration:line-through;}
  .st-na,.st-esperando{background:rgba(107,114,128,.15);color:var(--muted);}
  .reemb-btn{margin-top:8px;padding:8px 12px;min-height:36px;font-size:.85rem;}
  .reemb-who{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--text);}
  .reemb-section{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:12px;}
  .reemb-section-title{font-weight:700;color:var(--text);margin-bottom:4px;}
  .copago-box{margin-top:14px;padding:10px 12px;border-radius:12px;background:rgba(239,68,68,.08);font-weight:700;color:var(--text);}
</style>
</head>

  <div id="app"></div>
  <div id="tabNav"></div>
  <button id="fab" class="fab" aria-label="Agregar" type="button">+</button>
  <div id="modalRoot"></div>
  <input type="file" id="photoInput" accept="image/*" style="display:none">
  <input type="file" id="photoInputCamera" accept="image/*" capture="environment" style="display:none">

  var db = loadDB();

          var r = d.reembolso;
          if(!r || (d.type !== 'boleta' && d.type !== 'bono')) return;
          var untouched = r.monto === '' && r.seg.estado === 'na' && !r.seg.fecha && r.seg.monto === '' && !r.prev.fecha && r.prev.monto === '';
          if(untouched){ r.seg.estado = 'pendiente'; changed = true; }
        });
      });
    });
    if(changed){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch(e){} }

  function loadDB(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.people)) return parsed;
      }
    } catch(e){ console.error('Error leyendo datos guardados', e); }
    return { people: [] };
  }

  function saveDB(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      return true;
    } catch(e){
      console.error('Error guardando datos', e);
      alert('No se pudo guardar. El almacenamiento del navegador está lleno. Intenta eliminar documentos antiguos para liberar espacio.');
      return false;
    }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function esc(str){
    if(str === undefined || str === null) return '';
    return String(str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function hasVal(x){
    return x !== '' && x !== undefined && x !== null;
  }

  function formatDate(dateStr){
    if(!dateStr) return 'Sin fecha';
    var parts = dateStr.split('-');
    if(parts.length !== 3) return esc(dateStr);
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  var AVATAR_COLORS = ['#f97316','#ec4899','#8b5cf6','#0ea5a0','#eab308','#3b82f6','#ef4444','#14b8a6','#a855f7','#059669'];

  function colorForId(id){
    var hash = 0;
    for(var i = 0; i < id.length; i++){ hash = (hash * 31 + id.charCodeAt(i)) >>> 0; }
    return AVATAR_COLORS[hash % AVATAR_COLORS.length];
  }

  function initialsFor(name){
    if(!name || !name.trim()) return '?';
    var parts = name.trim().split(/\s+/);
    var first = parts[0] ? parts[0][0] : '';
    var second = parts.length > 1 ? parts[1][0] : '';
    return (first + second).toUpperCase();
  }

  function iconForSpecialty(name){
    if(!name || name === 'Sin especialidad') return icon('folder', 20);
    var norm = name.toLowerCase();
    if(norm.normalize) norm = norm.normalize('NFD').replace(/[̀-ͯ]/g, '');
    for(var i = 0; i < SPECIALTY_ICONS.length; i++){
      var keywords = SPECIALTY_ICONS[i][0];
      for(var j = 0; j < keywords.length; j++){
        if(norm.indexOf(keywords[j]) !== -1) return icon(SPECIALTY_ICONS[i][1], 20);
      }
    }
    return icon('clipboard-list', 20);
  }

  function sortPeople(people){
    return people.slice().sort(function(a, b){
      var an = (a.name || '').trim();
      var bn = (b.name || '').trim();
      if(!an && bn) return 1;
      if(an && !bn) return -1;
      if(!an && !bn) return 0;
      return an.localeCompare(bn, 'es', { sensitivity: 'base' });
    });
  }

  function compressImage(file, maxDim, quality){
    maxDim = maxDim || 1000;
    quality = quality || 0.72;
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var width = img.width, height = img.height;
          if(width > height && width > maxDim){
            height = Math.round(height * maxDim / width);
            width = maxDim;
          } else if(height >= width && height > maxDim){
            width = Math.round(width * maxDim / height);
            height = maxDim;
          }
          var canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = function(){ reject(new Error('No se pudo leer la imagen')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('No se pudo leer el archivo')); };
      reader.readAsDataURL(file);
    });
  }

  // ---------- Reembolsos ----------

  var PREVISIONES = ['Fonasa', 'Banmédica', 'Colmena', 'Consalud', 'Cruz Blanca', 'Esencial', 'Nueva Masvida', 'Vida Tres'];
  var ESTADO_LABEL = { na: 'No aplica', pendiente: 'Pendiente', enviado: 'Enviado', reembolsado: 'Reembolsado', rechazado: 'Rechazado' };

  function isConfigured(person){ return !!(person && (person.prevision || person.seguro)); }

  // Reglas aprendidas: qué doctores / especialidades no pasan por la Isapre
  function ruleKeys(visit){
    var k = [];
    if(visit && visit.doctor && visit.doctor.trim()) k.push('doc:' + visit.doctor.trim().toLowerCase());
    if(visit && visit.specialty && visit.specialty.trim()) k.push('esp:' + visit.specialty.trim().toLowerCase());
    return k;
  }
  function skipsPrevision(visit){
    var rules = db.reembRules || {};
    var keys = ruleKeys(visit);
    // El doctor manda; si no hay regla de doctor, se usa la especialidad
    if(keys[0] && keys[0].indexOf('doc:') === 0 && rules[keys[0]] !== undefined) return rules[keys[0]] === 'directo';
    var esp = keys.filter(function(k){ return k.indexOf('esp:') === 0; })[0];
    return !!(esp && rules[esp] === 'directo');
  }
  function learnRule(visit, directo){
    var keys = ruleKeys(visit);
    if(!keys.length) return;
    if(!db.reembRules) db.reembRules = {};
    var key = keys[0]; // doctor si existe, si no especialidad
    if(directo) db.reembRules[key] = 'directo';
    else if(db.reembRules[key] === 'directo' || key.indexOf('doc:') === 0) db.reembRules[key] = 'isapre';
  }

  function defaultReembolso(person, type, visit){
    // Persona sin configurar: no sabemos si tiene seguro, así que se asume pendiente
    var segEstado = (person && person.seguro) || !isConfigured(person) ? 'pendiente' : 'na';
    return {
      monto: '',
      prev: { estado: (type === 'bono' || skipsPrevision(visit)) ? 'na' : 'pendiente', fecha: '', monto: '' },
      seg: { estado: segEstado, fecha: '', monto: '' }
    };
  }

  var DOC_LABEL = { orden: 'Orden', receta: 'Receta', boleta: 'Boleta', bono: 'Bono Isapre' };
  function docLabel(t){ return DOC_LABEL[t] || t; }
  function isReembDoc(doc){ return doc.type === 'boleta' || doc.type === 'bono'; }

  function makeDoc(name, dataUrl, type, person, visit){
    var d = { id: uid(), name: name, dataUrl: dataUrl, type: type };
    // Con bono la Isapre ya pagó su parte: solo queda el seguro
    if(isReembDoc(d)) d.reembolso = defaultReembolso(person, type, visit);
    return d;
  }

  function fmtCLP(n){
    if(!hasVal(n) || isNaN(Number(n))) return '—';
    return '$' + Math.round(Number(n)).toLocaleString('es-CL');
  }

  function prevLabel(person){ return (person && person.prevision) ? person.prevision : 'Isapre/Fonasa'; }
  function segLabel(person){ return (person && person.seguro) ? person.seguro : 'Seguro'; }

  function daysSince(dateStr){
    if(!dateStr) return null;
    var p = dateStr.split('-');
    if(p.length !== 3) return null;
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    var t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.round((t - d) / 86400000);
  }

  function todayStr(){
    var t = new Date();
    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  }

  function isOpenEstado(e){ return e === 'pendiente' || e === 'enviado'; }

  function isReembPending(doc){
    var r = doc.reembolso;
    if(!r) return false;
    return isOpenEstado(r.prev.estado) || isOpenEstado(r.seg.estado);
  }

  // Hay algo que la persona tiene que enviar ahora
  function needsAction(r){
    if(r.prev.estado === 'pendiente') return true;
    return r.seg.estado === 'pendiente' && !isOpenEstado(r.prev.estado);
  }

  function oldestSent(r){
    var f = [r.prev, r.seg].filter(function(x){ return x.estado === 'enviado' && x.fecha; }).map(function(x){ return x.fecha; }).sort();
    return f[0] || '9999';
  }

  function reembRecuperado(r){
    var total = 0;
    if(r.prev.estado === 'reembolsado' && hasVal(r.prev.monto)) total += Number(r.prev.monto);
    if(r.seg.estado === 'reembolsado' && hasVal(r.seg.monto)) total += Number(r.seg.monto);
    return total;
  }

  function reembCopago(r){
    if(!hasVal(r.monto)) return null;
    return Number(r.monto) - reembRecuperado(r);
  }

  function estadoChip(part, isSeg, r, doc){
    var e = part.estado;
    if(!isSeg && e === 'na' && doc && doc.type === 'bono'){
      return '<span class="st st-na">Pagado con bono</span>';
    }
    if(!isSeg && e === 'na') return '<span class="st st-na">No cubre</span>';
    if(isSeg && e === 'pendiente' && isOpenEstado(r.prev.estado)){
      return '<span class="st st-esperando">Esperando previsión</span>';
    }
    var txt = ESTADO_LABEL[e] || e;
    if(e === 'enviado'){
      var ds = daysSince(part.fecha);
      if(ds !== null) txt += ds <= 0 ? ' · hoy' : ' · hace ' + ds + ' día' + (ds === 1 ? '' : 's');
    }
    if(e === 'reembolsado' && hasVal(part.monto)) txt += ' · ' + fmtCLP(part.monto);
    return '<span class="st st-' + e + '">' + txt + '</span>';
  }

  function renderReembBlock(doc, person){
    var r = doc.reembolso;
    if(!r) return '<div class="reemb-block">Sin seguimiento de reembolso</div>';
    var copago = reembCopago(r);
    return '' +
    '<div class="reemb-block">' +
      (hasVal(r.monto) ? '<div class="reemb-line"><strong style="color:var(--text);">' + fmtCLP(r.monto) + '</strong>' + (copago !== null && reembRecuperado(r) > 0 ? ' · copago ' + fmtCLP(copago) : '') + '</div>' : '') +
      '<div class="reemb-line">' + esc(prevLabel(person)) + ': ' + estadoChip(r.prev, false, r, doc) + '</div>' +
      '<div class="reemb-line">' + esc(segLabel(person)) + ': ' + estadoChip(r.seg, true, r, doc) + '</div>' +
    '</div>';
  }

  function allBoletas(){
    var out = [];
    db.people.forEach(function(person){
      person.visits.forEach(function(visit){
        (visit.documents || []).forEach(function(doc){
          if(isReembDoc(doc)) out.push({ doc: doc, visit: visit, person: person });
        });
      });
    });
    return out;
  }

  // Siguiente paso del trámite: primero previsión, después seguro
  function nextAction(r){
    if(!r) return null;
    if(r.prev.estado === 'pendiente') return { part: 'prev', act: 'enviar' };
    if(r.prev.estado === 'enviado') return { part: 'prev', act: 'recibir' };
    if(r.seg.estado === 'pendiente') return { part: 'seg', act: 'enviar' };
    if(r.seg.estado === 'enviado') return { part: 'seg', act: 'recibir' };
    return null;
  }

  function reembBucket(doc){
    if(!doc.reembolso) return 'sinregistrar';
    if(!isReembPending(doc)) return 'cerrados';
    return needsAction(doc.reembolso) ? 'porenviar' : 'entramite';
  }

  function attachmentsLine(v){
    var docs = v.documents || [];
    var n = { orden: 0, receta: 0 };
    docs.forEach(function(d){ if(n[d.type] !== undefined) n[d.type]++; });
    var parts = [];
    if(n.orden) parts.push('Orden' + (n.orden > 1 ? ' (' + n.orden + ')' : ''));
    if(n.receta) parts.push('Receta' + (n.receta > 1 ? ' (' + n.receta + ')' : ''));
    return '<div class="reemb-attach">' + (parts.length ? 'En la atención: ' + parts.join(' · ') : 'Sin orden ni receta en la atención') + '</div>';
  }

  // Marca una boleta/bono antiguo como ya cobrado (sin montos)
  function historicReembolso(doc, person){
    return {
      monto: '',
      prev: { estado: doc.type === 'bono' ? 'na' : 'reembolsado', fecha: '', monto: '' },
      seg: { estado: (person.seguro || !isConfigured(person)) ? 'reembolsado' : 'na', fecha: '', monto: '' },
      historico: true
    };
  }

  function renderReembCard(item){
    var p = item.person, v = item.visit, doc = item.doc;
    var ids = ' data-doc-id="' + doc.id + '" data-visit-id="' + v.id + '" data-person-id="' + p.id + '"';
    var na = nextAction(doc.reembolso);
    var actions;
    if(!doc.reembolso){
      actions = '<button class="btn-primary reemb-start"' + ids + ' type="button">Está pendiente</button>' +
        '<button class="btn-secondary reemb-hist"' + ids + ' type="button">Ya la cobré</button>' +
        '<button class="btn-secondary reemb-btn reemb-edit"' + ids + ' type="button" aria-label="Editar">' + icon('pencil', 14) + '</button>';
    } else {
      var primary = '';
      if(na){
        var who = esc(na.part === 'prev' ? prevLabel(p) : segLabel(p));
        primary = na.act === 'enviar'
          ? '<button class="btn-primary reemb-quick"' + ids + ' data-part="' + na.part + '" data-act="enviar" type="button">' + icon('send', 14) + ' Marqué enviado a ' + who + '</button>'
          : '<button class="btn-primary reemb-quick"' + ids + ' data-part="' + na.part + '" data-act="recibir" type="button">' + icon('banknote', 14) + ' Recibí respuesta de ' + who + '</button>';
      }
      actions = primary + '<button class="btn-secondary reemb-btn reemb-edit"' + ids + ' type="button">' + icon('pencil', 14) + ' Editar</button>';
      if(na && na.part === 'prev' && na.act === 'enviar'){
        actions += '</div><div class="reemb-actions"><button class="reemb-skip"' + ids + ' type="button">No pasa por ' + esc(prevLabel(p)) + ' → directo al seguro</button>';
      }
    }
    return '' +
    '<div class="card">' +
      '<div style="display:flex;gap:10px;align-items:flex-start;">' +
        '<img src="' + doc.dataUrl + '" style="width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;flex-shrink:0;" class="view-doc-btn"' + ids + ' alt="Documento">' +
        '<div style="flex:1;min-width:0;">' +
          '<div class="reemb-who"><div class="avatar" style="background:' + colorForId(p.id) + ';width:24px;height:24px;font-size:.65rem;">' + initialsFor(p.name) + '</div>' + esc(p.name) + '</div>' +
          '<div class="card-subtitle" style="margin-top:2px;">' + formatDate(v.date) + (v.specialty ? ' · ' + esc(v.specialty) : '') + (v.healthCenter ? ' · ' + esc(v.healthCenter) : '') + '</div>' +
          '<span class="doc-type-tag ' + doc.type + '">' + docLabel(doc.type) + '</span>' +
          renderReembBlock(doc, p) +
          attachmentsLine(v) +
        '</div>' +
      '</div>' +
      '<div class="reemb-actions">' + actions + '</div>' +
    '</div>';
  }

  function renderReembolsos(){
    var items = allBoletas();
    var filter = view.filter || 'porenviar';
    if(filter === 'pendientes') filter = 'porenviar';
    var groups = { porenviar: [], entramite: [], cerrados: [], sinregistrar: [] };
    items.forEach(function(it){ groups[reembBucket(it.doc)].push(it); });

    var enTramite = 0, recuperado = 0;
    items.forEach(function(it){
      var r = it.doc.reembolso;
      if(!r) return;
      recuperado += reembRecuperado(r);
      if(isReembPending(it.doc) && hasVal(r.monto)) enTramite += Math.max(0, Number(r.monto) - reembRecuperado(r));
    });

    function chip(key, label){
      return '<button class="filter-chip' + (filter === key ? ' active' : '') + '" data-filter="' + key + '" type="button">' + label + ' (' + groups[key].length + ')</button>';
    }

    var list = groups[filter] || [];
    if(filter === 'porenviar') list.sort(function(a, b){ return (a.visit.date || '').localeCompare(b.visit.date || ''); });
    else if(filter === 'entramite') list.sort(function(a, b){ return oldestSent(a.doc.reembolso).localeCompare(oldestSent(b.doc.reembolso)); });
    else list.sort(function(a, b){ return (b.visit.date || '').localeCompare(a.visit.date || ''); });

    var emptyMsg = {
      porenviar: 'Nada por enviar.',
      entramite: 'Nada en trámite.',
      cerrados: 'Aún no hay reembolsos cerrados.',
      sinregistrar: 'Todas las boletas y bonos tienen seguimiento.'
    }[filter];
    var bulk = (filter === 'sinregistrar' && list.length > 1)
      ? '<button class="btn-secondary" id="bulkHist" type="button" style="width:100%;margin-bottom:12px;">Marcar todas (' + list.length + ') como ya cobradas</button>' +
        '<div class="reemb-hint" style="margin:-6px 0 12px;">Tip: primero marca las que siguen pendientes con "Está pendiente" y después usa este botón para el resto.</div>'
      : '';
    var body = list.length ? bulk + list.map(renderReembCard).join('') :
      '<div class="empty">' + icon('banknote', 40) + '<br>' + emptyMsg + '</div>';

    var banner = (groups.sinregistrar.length && filter !== 'sinregistrar')
      ? '<button class="reemb-banner" data-filter="sinregistrar" type="button">Tienes ' + groups.sinregistrar.length + ' boleta' + (groups.sinregistrar.length === 1 ? '' : 's') + ' o bono' + (groups.sinregistrar.length === 1 ? '' : 's') + ' sin seguimiento · Ver</button>'
      : (filter === 'sinregistrar' ? '<button class="reemb-banner" data-filter="porenviar" type="button">&larr; Volver a reembolsos</button>' : '');

    return '' +
    '<div class="header">' +
      '<h1 style="gap:10px;">' + icon('banknote', 22) + ' Reembolsos</h1>' +
      '<div class="header-sub">Previsión y seguro complementario</div>' +
    '</div>' +
    '<div class="content">' +
      '<div class="reemb-summary">' +
        '<div><div class="num">' + fmtCLP(enTramite) + '</div><div class="lbl">Saldo de boletas en trámite</div></div>' +
        '<div><div class="num">' + fmtCLP(recuperado) + '</div><div class="lbl">Recuperado total</div></div>' +
      '</div>' +
      '<div class="filter-row">' +
        chip('porenviar', 'Por enviar') +
        chip('entramite', 'En trámite') +
        chip('cerrados', 'Cerrados') +
      '</div>' +
      banner +
      body +
    '</div>';
  }

  function quickEnviar(personId, visitId, docId, part){
    var f = findDoc(personId, visitId, docId);
    if(!f || !f.doc.reembolso) return;
    f.doc.reembolso[part].estado = 'enviado';
    f.doc.reembolso[part].fecha = todayStr();
    if(saveDB()) render();
  }

  function findDoc(personId, visitId, docId){
    var person = db.people.filter(function(p){ return p.id === personId; })[0];
    if(!person) return null;
    var visit = person.visits.filter(function(v){ return v.id === visitId; })[0];
    if(!visit) return null;
    var doc = (visit.documents || []).filter(function(d){ return d.id === docId; })[0];
    return doc ? { person: person, visit: visit, doc: doc } : null;
  }

  function openRecibirModal(personId, visitId, docId, part){
    var f = findDoc(personId, visitId, docId);
    if(!f || !f.doc.reembolso) return;
    var r = f.doc.reembolso;
    var who = part === 'prev' ? prevLabel(f.person) : segLabel(f.person);
    var askMonto = !hasVal(r.monto);
    modalRoot.innerHTML = '' +
    '<div class="modal-overlay" id="modalOverlay">' +
      '<div class="modal">' +
        '<div class="modal-header">Respuesta de ' + esc(who) + '</div>' +
        '<div class="modal-body">' +
          '<div class="card-subtitle" style="margin-bottom:8px;">' + esc(f.person.name) + ' · ' + formatDate(f.visit.date) + (f.visit.specialty ? ' · ' + esc(f.visit.specialty) : '') + '</div>' +
          (askMonto ? '<label for="q-total">' + (f.doc.type === 'bono' ? 'Copago pagado ($)' : 'Monto de la boleta ($)') + ' <span style="font-weight:400;">(opcional)</span></label>' +
            '<input type="number" inputmode="numeric" min="0" id="q-total" placeholder="Ej: 45000">' : '') +
          '<label for="q-monto">¿Cuánto te reembolsó? ($)</label>' +
          '<input type="number" inputmode="numeric" min="0" id="q-monto" placeholder="Ej: 25000">' +
        '</div>' +
        '<div class="modal-actions doc-type-grid">' +
          '<button class="btn-secondary" id="qRechazado" type="button">Fue rechazado</button>' +
          '<button class="btn-primary" id="qGuardar" type="button">Guardar</button>' +
          '<button class="btn-secondary" id="modalCancel" type="button">Cancelar</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    bindModalShell();
    setTimeout(function(){ var el = document.getElementById('q-monto'); if(el) el.focus(); }, 50);

    function applyTotal(){
      var t = document.getElementById('q-total');
      if(t && t.value !== '') r.monto = Number(t.value);
    }
    document.getElementById('qGuardar').addEventListener('click', function(){
      var m = document.getElementById('q-monto').value;
      if(m === ''){ alert('Ingresa el monto reembolsado, o usa "Fue rechazado".'); return; }
      var prevMonto = r.monto;
      applyTotal();
      var test = JSON.parse(JSON.stringify(r));
      test[part].estado = 'reembolsado'; test[part].monto = Number(m);
      if(hasVal(test.monto) && reembRecuperado(test) > Number(test.monto)){
        r.monto = prevMonto;
        alert('Lo reembolsado supera el monto de la boleta. Revisa los montos.');
        return;
      }
      r[part].estado = 'reembolsado';
      r[part].monto = Number(m);
      if(saveDB()){ closeModal(); render(); }
    });
    document.getElementById('qRechazado').addEventListener('click', function(){
      applyTotal();
      r[part].estado = 'rechazado';
      r[part].monto = '';
      if(saveDB()){ closeModal(); render(); }
    });
  }

  function openDocFromBtn(el){
    var person = db.people.filter(function(p){ return p.id === el.dataset.personId; })[0];
    if(!person) return;
    var visit = person.visits.filter(function(v){ return v.id === el.dataset.visitId; })[0];
    if(!visit) return;
    var doc = (visit.documents || []).filter(function(d){ return d.id === el.dataset.docId; })[0];
    if(doc) openLightbox(doc.dataUrl, doc.name);
  }

  // ---------- Render ----------

  function render(){
    if(view.type === 'inicio'){
      appEl.innerHTML = renderPeopleList();
    } else if(view.type === 'person'){
      appEl.innerHTML = renderPersonDetail(view.personId);
    } else if(view.type === 'ordenes' || view.type === 'recetas' || view.type === 'boletas'){
      appEl.innerHTML = renderDocumentsByType(view.type);
    } else if(view.type === 'reembolsos'){
      appEl.innerHTML = renderReembolsos();
    }
    attachHandlers();
    renderTabNav();
  }

  function renderTabNav(){
    var tabs = [
      { type: 'inicio', label: 'Inicio', icon: 'users' },
      { type: 'ordenes', label: 'Órdenes', icon: 'clipboard-list' },
      { type: 'recetas', label: 'Recetas', icon: 'pill' },
      { type: 'boletas', label: 'Boletas y bonos', icon: 'receipt' },
      { type: 'reembolsos', label: 'Reembolsos', icon: 'banknote' }
    ];
    var html = '<nav class="tab-nav">' + tabs.map(function(tab){
      var active = view.type === tab.type ? ' active' : '';
      return '<button class="tab-btn' + active + '" data-tab="' + tab.type + '" type="button"><span class="tab-icon">' + icon(tab.icon, 22) + '</span><span>' + tab.label + '</span></button>';
    }).join('') + '</nav>';
    tabNavEl.innerHTML = html;
  }

  function renderPeopleList(){
    var people = sortPeople(db.people);
    var itemsHtml;
    if(people.length === 0){
      itemsHtml = '<div class="empty">' + icon('users', 40) + '<br>No hay personas registradas.<br>Toca el botón + para agregar la primera persona.</div>';
    } else {
      itemsHtml = people.map(function(p){
        var pills = [];
        if(p.sexo) pills.push('<span class="pill">' + sexIcon(p.sexo) + esc(p.sexo) + '</span>');
        if(hasVal(p.edad)) pills.push('<span class="pill">' + icon('cake', 14) + ' ' + esc(p.edad) + ' años</span>');
        if(hasVal(p.peso)) pills.push('<span class="pill">' + icon('scale', 14) + ' ' + esc(p.peso) + ' kg</span>');
        if(hasVal(p.estatura)) pills.push('<span class="pill">' + icon('ruler', 14) + ' ' + esc(p.estatura) + ' cm</span>');
        var pillsHtml = pills.length ? '<div class="pill-row">' + pills.join('') + '</div>' : '<div class="card-subtitle">Sin datos adicionales</div>';
        var visitCount = p.visits.length;
        return '' +
        '<div class="card person-card" data-person-id="' + p.id + '">' +
          '<div class="avatar" style="background:' + colorForId(p.id) + '">' + initialsFor(p.name) + '</div>' +
          '<div class="card-main">' +
            '<div class="card-title">' + (esc(p.name) || 'Persona sin nombre') + '</div>' +
            pillsHtml +
            '<div class="card-meta">' + icon('calendar', 14) + ' ' + visitCount + ' registro' + (visitCount === 1 ? '' : 's') + ' médico' + (visitCount === 1 ? '' : 's') + '</div>' +
          '</div>' +
          '<div class="card-actions">' +
            '<button class="icon-btn edit-person-btn" data-id="' + p.id + '" aria-label="Editar persona" type="button">' + icon('pencil', 18) + '</button>' +
            '<button class="icon-btn danger delete-person-btn" data-id="' + p.id + '" aria-label="Eliminar persona" type="button">' + icon('trash-2', 18) + '</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }
    return '' +
    '<div class="header">' +
      '<h1 style="gap:12px;"><span class="pulse-icon">' + icon('stethoscope', 22) + '</span> DataMed</h1>' +
      '<div class="header-sub">Centraliza. Comparte. Controla.</div>' +
    '</div>' +
    '<div class="content">' + itemsHtml + '</div>';
  }

  function renderPersonDetail(personId){
    var person = db.people.filter(function(p){ return p.id === personId; })[0];
    if(!person){
      view = { type: 'inicio' };
      return renderPeopleList();
    }
    var groups = {};
    person.visits.forEach(function(v){
      var key = (v.specialty && v.specialty.trim()) ? v.specialty.trim() : 'Sin especialidad';
      if(!groups[key]) groups[key] = [];
      groups[key].push(v);
    });
    var specialtyNames = Object.keys(groups).sort(function(a, b){
      if(a === 'Sin especialidad') return 1;
      if(b === 'Sin especialidad') return -1;
      return a.localeCompare(b, 'es');
    });

    var groupsHtml;
    if(specialtyNames.length === 0){
      groupsHtml = '<div class="empty">' + icon('clipboard-list', 40) + '<br>No hay registros médicos.<br>Toca el botón + para agregar un registro.</div>';
    } else {
      groupsHtml = specialtyNames.map(function(spec){
        var visits = groups[spec].slice().sort(function(a, b){
          return (b.date || '').localeCompare(a.date || '');
        });
        var isOpen = expandedSpecialties.has(spec);
        var visitsHtml = visits.map(function(v){ return renderVisitCard(v, person.id); }).join('');
        return '' +
        '<div class="accordion-group">' +
          '<button class="accordion-header" data-spec="' + esc(spec) + '" type="button">' +
            '<span class="chevron">' + icon(isOpen ? 'chevron-down' : 'chevron-right', 16) + '</span>' +
            '<span class="spec-icon">' + iconForSpecialty(spec) + '</span>' +
            '<span class="spec-name">' + esc(spec) + '</span>' +
            '<span class="badge">' + visits.length + '</span>' +
          '</button>' +
          '<div class="accordion-body' + (isOpen ? '' : ' hidden') + '">' + visitsHtml + '</div>' +
        '</div>';
      }).join('');
    }

    var personPills = [];
    if(person.sexo) personPills.push('<span class="pill">' + sexIcon(person.sexo) + esc(person.sexo) + '</span>');
    if(hasVal(person.edad)) personPills.push('<span class="pill">' + icon('cake', 14) + ' ' + esc(person.edad) + ' años</span>');
    if(hasVal(person.peso)) personPills.push('<span class="pill">' + icon('scale', 14) + ' ' + esc(person.peso) + ' kg</span>');
    if(hasVal(person.estatura)) personPills.push('<span class="pill">' + icon('ruler', 14) + ' ' + esc(person.estatura) + ' cm</span>');
    var personPillsHtml = personPills.length ? '<div class="pill-row">' + personPills.join('') + '</div>' : '<div class="header-sub">Sin datos adicionales</div>';

    return '' +
    '<div class="header">' +
      '<button id="backBtn" class="back-btn" type="button">&larr; Volver</button>' +
      '<div class="person-header-row">' +
        '<div class="avatar avatar-lg" style="background:' + colorForId(person.id) + '">' + initialsFor(person.name) + '</div>' +
        '<div>' +
          '<h1>' + (esc(person.name) || 'Persona sin nombre') + '</h1>' +
          personPillsHtml +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="content">' +
      '<div class="section-title">Registros médicos</div>' +
      groupsHtml +
    '</div>';
  }

  function renderDocumentsByType(docType){
    var docTypeLabel = docType === 'ordenes' ? 'Órdenes' : docType === 'recetas' ? 'Recetas' : 'Boletas y bonos';
    var singularType = docType === 'ordenes' ? 'orden' : docType === 'recetas' ? 'receta' : 'boleta';
    var allDocs = [];
    db.people.forEach(function(person){
      person.visits.forEach(function(visit){
        if(visit.documents){
          visit.documents.forEach(function(doc){
            if(doc.type === singularType || (singularType === 'boleta' && doc.type === 'bono')){
              allDocs.push({
                doc: doc,
                visit: visit,
                person: person
              });
            }
          });
        }
      });
    });

    var groupsByPerson = {};
    allDocs.forEach(function(item){
      var pkey = item.person.id;
      if(!groupsByPerson[pkey]) groupsByPerson[pkey] = {
        person: item.person,
        bySpec: {}
      };
      var spec = item.visit.specialty || 'Sin especialidad';
      if(!groupsByPerson[pkey].bySpec[spec]) groupsByPerson[pkey].bySpec[spec] = [];
      groupsByPerson[pkey].bySpec[spec].push(item);
    });

    var sortedPeople = sortPeople(Object.keys(groupsByPerson).map(function(k){ return groupsByPerson[k].person; }));

    var groupsHtml;
    if(allDocs.length === 0){
      groupsHtml = '<div class="empty">' + icon('clipboard-list', 40) + '<br>No hay ' + docTypeLabel.toLowerCase() + ' registradas.</div>';
    } else {
      groupsHtml = sortedPeople.map(function(person){
        var personGroup = groupsByPerson[person.id];
        var specs = Object.keys(personGroup.bySpec).sort();
        var specsHtml = specs.map(function(spec){
          var items = personGroup.bySpec[spec];
          var isOpen = expandedSpecialties.has(person.id + ':' + spec);
          var docsHtml = items.map(function(item){
            return renderDocumentItem(item.doc, person.id, item.visit.id, item.visit, person);
          }).join('');
          return '' +
          '<div class="accordion-group">' +
            '<button class="accordion-header" data-spec="' + esc(person.id + ':' + spec) + '" type="button">' +
              '<span class="chevron">' + icon(isOpen ? 'chevron-down' : 'chevron-right', 16) + '</span>' +
              '<span class="spec-icon">' + iconForSpecialty(spec) + '</span>' +
              '<span class="spec-name">' + esc(spec) + '</span>' +
              '<span class="badge">' + items.length + '</span>' +
            '</button>' +
            '<div class="accordion-body' + (isOpen ? '' : ' hidden') + '">' + docsHtml + '</div>' +
          '</div>';
        }).join('');
        return '' +
        '<div style="margin-bottom:20px;">' +
          '<div style="display:flex;align-items:center;gap:8px;margin:12px 0 8px;padding:0 4px;">' +
            '<div class="avatar" style="background:' + colorForId(person.id) + ';width:40px;height:40px;font-size:0.9rem;">' + initialsFor(person.name) + '</div>' +
            '<div style="font-weight:700;color:var(--text);">' + esc(person.name) + '</div>' +
          '</div>' +
          specsHtml +
        '</div>';
      }).join('');
    }

    var headerIcon = docType === 'ordenes' ? 'clipboard-list' : docType === 'recetas' ? 'pill' : 'receipt';
    return '' +
    '<div class="header">' +
      '<h1 style="gap:10px;">' + icon(headerIcon, 22) + ' ' + docTypeLabel + '</h1>' +
      '<div class="header-sub">Organizadas por persona y especialidad</div>' +
    '</div>' +
    '<div class="content">' + groupsHtml + '</div>';
  }

  function renderVisitCard(v, personId){
    var isOpen = expandedVisits.has(v.id);
    var dateDisplay = formatDate(v.date);
    var doctorDisplay = v.doctor ? esc(v.doctor) : 'Sin doctor';
    var diagnosisPreview = v.diagnosis ? esc(v.diagnosis).slice(0, 90) : 'Sin diagnóstico registrado';

    var detailsHtml = '';
    if(isOpen){
      var docsHtml = '';
      ['orden', 'receta', 'boleta', 'bono'].forEach(function(dtype){
        var docs = v.documents ? v.documents.filter(function(d){ return d.type === dtype; }) : [];
        if(docs.length){
          docsHtml += '<div style="margin-top:12px;">' +
            '<span class="detail-label">' + ({ orden: 'Órdenes', receta: 'Recetas', boleta: 'Boletas', bono: 'Bonos Isapre' })[dtype] + '</span>' +
            '<div class="doc-row">' + docs.map(function(d){
              return '' +
              '<div class="doc-thumb-wrap">' +
                '<img src="' + d.dataUrl + '" class="doc-thumb view-doc-btn" data-doc-id="' + d.id + '" data-visit-id="' + v.id + '" data-person-id="' + personId + '" alt="Documento">' +
                '<button class="doc-delete-btn" data-doc-id="' + d.id + '" data-visit-id="' + v.id + '" data-person-id="' + personId + '" aria-label="Eliminar documento" type="button">' + icon('trash-2', 14) + '</button>' +
              '</div>';
            }).join('') + '</div>' +
          '</div>';
        }
      });
      if(!docsHtml){
        docsHtml = '<div class="no-docs">Sin documentos adjuntos</div>';
      }
      detailsHtml = '' +
      '<div class="visit-details">' +

          if(expandedSpecialties.has(spec)) expandedSpecialties.delete(spec);

  function qa(sel){
    return Array.prototype.slice.call(appEl.querySelectorAll(sel));
  }

  function handlePhotoInputChange(e){
    var file = e.target.files[0];
    if(!file) return;
    if(!file.type || file.type.indexOf('image/') !== 0){
      alert('Por favor selecciona un archivo de imagen.');
      return;
    }
    compressImage(file).then(function(dataUrl){
      var target = currentPhotoTarget;
      if(target.mode === 'pending'){
        openDocTypeChooser(dataUrl, file.name, function(type){
          var tPerson = db.people.filter(function(p){ return p.id === target.personId; })[0];
          target.draft.pendingDocs.push(makeDoc(file.name, dataUrl, type, tPerson, target.draft));
          openVisitModal(target.personId, target.visitId, target.draft);
        });
      } else {
        var person = db.people.filter(function(p){ return p.id === target.personId; })[0];
        var visit = person.visits.filter(function(v){ return v.id === target.visitId; })[0];
        if(!visit.documents) visit.documents = [];
        openDocTypeChooser(dataUrl, file.name, function(type){
          var newDoc = makeDoc(file.name, dataUrl, type, person, visit);
          visit.documents.push(newDoc);
          expandedVisits.add(visit.id);
          if(saveDB()){
            closeModal();
            render();
            // Boleta o bono: pasar directo a registrar el reembolso
            if(isReembDoc(newDoc)) openReembolsoModal(person.id, visit.id, newDoc.id);
          }
        }, target.mode === 'reemb' ? ['boleta', 'bono'] : null);
      }
    }).catch(function(err){
      console.error(err);
      alert('No se pudo procesar la imagen.');
    });
  }
  photoInput.addEventListener('change', handlePhotoInputChange);
  photoInputCamera.addEventListener('change', handlePhotoInputChange);

      });

            '<option value="">Sin especificar</option>' +

          '<label for="f-estatura">Estatura (cm)</label>' +
          '<input type="number" id="f-estatura" min="0" step="0.1" value="' + (person && hasVal(person.estatura) ? person.estatura : '') + '" placeholder="Ej: 170">' +
          '<label for="f-prevision">Previsión</label>' +
          '<input type="text" id="f-prevision" list="previsionList" value="' + (person ? esc(person.prevision || '') : '') + '" placeholder="Ej: Fonasa, Colmena">' +
          '<datalist id="previsionList">' + PREVISIONES.map(function(x){ return '<option value="' + x + '">'; }).join('') + '</datalist>' +
          '<label for="f-seguro">Seguro complementario</label>' +

        '</div>' +

          '<button class="btn-primary" id="modalSave" type="button">Guardar</button>' +

      var name = document.getElementById('f-name').value.trim();

      var edadVal = document.getElementById('f-edad').value;
      var pesoVal = document.getElementById('f-peso').value;
      var estaturaVal = document.getElementById('f-estatura').value;
      var data = {
        name: name,
        sexo: sexo || '',
        edad: edadVal === '' ? '' : Number(edadVal),
        peso: pesoVal === '' ? '' : Number(pesoVal),
        estatura: estaturaVal === '' ? '' : Number(estaturaVal),
        prevision: document.getElementById('f-prevision').value.trim(),
        seguro: document.getElementById('f-seguro').value.trim()
      };
      if(isEdit){
        Object.assign(person, data);
      } else {
        db.people.push(Object.assign({ id: uid(), visits: [] }, data));
      }
      if(saveDB()){
        closeModal();
        render();
      }
    });

  function openVisitModal(personId, visitId, draft){
    var person = db.people.filter(function(p){ return p.id === personId; })[0];
    if(!person) return;
    var visit = visitId ? person.visits.filter(function(v){ return v.id === visitId; })[0] : null;
    var isEdit = !!visit;
    var specialtyOptions = person.visits
      .map(function(v){ return v.specialty; })
      .filter(function(s, i, arr){ return s && arr.indexOf(s) === i; });
    var healthCenterOptions = person.visits
      .map(function(v){ return v.healthCenter; })
      .filter(function(s, i, arr){ return s && arr.indexOf(s) === i; });

    var fieldVals = draft || {
      specialty: visit ? (visit.specialty || '') : '',
      doctor: visit ? (visit.doctor || '') : '',
      healthCenter: visit ? (visit.healthCenter || '') : '',
      date: visit && visit.date ? visit.date : '',
      diagnosis: visit ? (visit.diagnosis || '') : '',
      remedies: visit ? (visit.remedies || '') : '',
      wasVisit: visit ? (visit.wasVisit !== false) : true
    };
    var pendingDocs = (draft && draft.pendingDocs) ? draft.pendingDocs : [];

    var pendingDocsHtml = '';

        '</div>';

    modalRoot.innerHTML = '' +
    '<div class="modal-overlay" id="modalOverlay">' +
      '<div class="modal">' +
        '<div class="modal-header">' + (isEdit ? 'Editar registro médico' : 'Agregar registro médico') + '</div>' +
        '<div class="modal-body">' +
          '<label for="f-specialty">Especialidad</label>' +
          '<input type="text" id="f-specialty" list="specialtyList" value="' + esc(fieldVals.specialty) + '" placeholder="Ej: Cardiología">' +

            '<input type="checkbox" id="f-wasVisit"' + (fieldVals.wasVisit ? ' checked' : '') + ' style="width:auto;">' +
            'Fue visita médica presencial' +
          '</label>' +
          '<label for="f-doctor">Doctor/a</label>' +
          '<input type="text" id="f-doctor" value="' + esc(fieldVals.doctor) + '" placeholder="Nombre del doctor">' +
          '<label for="f-healthCenter">Centro de salud</label>' +
          '<input type="text" id="f-healthCenter" list="healthCenterList" value="' + esc(fieldVals.healthCenter) + '" placeholder="Ej: Clínica Las Condes">' +
          '<datalist id="healthCenterList">' + healthCenterOptions.map(function(s){ return '<option value="' + esc(s) + '">'; }).join('') + '</datalist>' +
          '<label for="f-date">Fecha</label>' +

          pendingDocsHtml +
          '<div style="display:flex;gap:8px;">' +
            '<button class="btn-secondary" id="modalAddDocCamera" type="button" style="flex:1;">' + icon('camera', 16) + ' Cámara</button>' +
            '<button class="btn-secondary" id="modalAddDocGallery" type="button" style="flex:1;">' + icon('image', 16) + ' Galería</button>' +
          '</div>' +
        '</div>' +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="modalCancel" type="button">Cancelar</button>' +
          '<button class="btn-primary" id="modalSave" type="button">Guardar</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    bindModalShell();

    function captureFormValues(){
      return {
        specialty: document.getElementById('f-specialty').value,
        doctor: document.getElementById('f-doctor').value,
        healthCenter: document.getElementById('f-healthCenter').value,
        date: document.getElementById('f-date').value,
        diagnosis: document.getElementById('f-diagnosis').value,
        remedies: document.getElementById('f-remedies').value,
        wasVisit: document.getElementById('f-wasVisit').checked,
        pendingDocs: pendingDocs
      };
    }

    document.getElementById('modalAddDocCamera').addEventListener('click', function(){
      currentPhotoTarget = { mode: 'pending', personId: personId, visitId: visitId, draft: captureFormValues() };
      photoInputCamera.value = '';
      photoInputCamera.click();
    });
    document.getElementById('modalAddDocGallery').addEventListener('click', function(){
      currentPhotoTarget = { mode: 'pending', personId: personId, visitId: visitId, draft: captureFormValues() };
      photoInput.value = '';
      photoInput.click();
    });

    Array.prototype.slice.call(modalRoot.querySelectorAll('.pending-doc-delete')).forEach(function(btn){
      btn.addEventListener('click', function(){
        var snapshot = captureFormValues();
        snapshot.pendingDocs = pendingDocs.filter(function(d){ return d.id !== btn.dataset.pendingId; });
        openVisitModal(personId, visitId, snapshot);
      });
    });

    document.getElementById('modalSave').addEventListener('click', function(){
      var data = {
        specialty: document.getElementById('f-specialty').value.trim(),
        doctor: document.getElementById('f-doctor').value.trim(),
        healthCenter: document.getElementById('f-healthCenter').value.trim(),
        date: document.getElementById('f-date').value,
        diagnosis: document.getElementById('f-diagnosis').value.trim(),
        remedies: document.getElementById('f-remedies').value.trim(),
        wasVisit: document.getElementById('f-wasVisit').checked
      };
      if(isEdit){
        Object.assign(visit, data);
        if(pendingDocs.length){
          if(!visit.documents) visit.documents = [];
          visit.documents = visit.documents.concat(pendingDocs);
          expandedVisits.add(visit.id);
        }
      } else {
        var newVisit = Object.assign({ id: uid(), documents: pendingDocs.slice() }, data);
        person.visits.push(newVisit);
        if(pendingDocs.length) expandedVisits.add(newVisit.id);
      }
      if(saveDB()){
        closeModal();
        render();
      }
    });
  }

  function openDocTypeChooser(dataUrl, filename, onSelect, allowed){
    modalRoot.innerHTML = '' +
    '<div class="modal-overlay" id="modalOverlay">' +
      '<div class="modal">' +
        '<div class="modal-header">¿Qué tipo de documento es?</div>' +
        '<div class="modal-body">' +
          '<div style="text-align:center;margin-bottom:16px;">' +
            '<img src="' + dataUrl + '" style="max-width:100%;max-height:150px;border-radius:8px;">' +
          '</div>' +
          '<label>Tipo de documento</label>' +
        '</div>' +
        '<div class="modal-actions doc-type-grid">' +
          '<button class="btn-secondary" id="docType-orden" type="button">' + icon('clipboard-list', 16) + ' Orden</button>' +
          '<button class="btn-secondary" id="docType-receta" type="button">' + icon('pill', 16) + ' Receta</button>' +
          '<button class="btn-secondary" id="docType-boleta" type="button">' + icon('receipt', 16) + ' Boleta</button>' +
          '<button class="btn-secondary" id="docType-bono" type="button">' + icon('banknote', 16) + ' Bono Isapre</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    ['orden', 'receta', 'boleta', 'bono'].forEach(function(type){
      var b = document.getElementById('docType-' + type);
      if(allowed && allowed.indexOf(type) === -1){ b.remove(); return; }
      b.addEventListener('click', function(){
        onSelect(type);
      });
    });
  }

  function openReembAddFlow(){
    if(db.people.length === 0){ openPersonModal(null); return; }
    var all = [];
    db.people.forEach(function(p){ p.visits.forEach(function(v){ all.push({ p: p, v: v }); }); });
    all.sort(function(a, b){ return (b.v.date || '').localeCompare(a.v.date || ''); });
    var list = all.slice(0, 20);
    modalRoot.innerHTML = '' +
    '<div class="modal-overlay" id="modalOverlay">' +
      '<div class="modal">' +
        '<div class="modal-header">¿De qué atención es la boleta o bono?</div>' +
        '<div class="modal-body">' +
          (list.length ? list.map(function(it){
            return '' +
            '<button class="btn-secondary pick-visit-btn" data-person-id="' + it.p.id + '" data-visit-id="' + it.v.id + '" type="button">' +
              '<div class="avatar" style="background:' + colorForId(it.p.id) + ';width:32px;height:32px;font-size:0.8rem;flex-shrink:0;">' + initialsFor(it.p.name) + '</div>' +
              '<div class="pv-main"><div>' + esc(it.p.name) + ' · ' + formatDate(it.v.date) + '</div>' +
              '<div class="pv-sub">' + (it.v.specialty ? esc(it.v.specialty) : 'Sin especialidad') + (it.v.doctor ? ' · ' + esc(it.v.doctor) : '') + '</div></div>' +
            '</button>';
          }).join('') : '<div class="card-subtitle">Aún no hay registros médicos.</div>') +
          '<button class="btn-secondary" id="pickNewVisit" type="button" style="width:100%;margin-top:4px;">+ Es de una atención que no he registrado</button>' +
        '</div>' +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="modalCancel" type="button">Cancelar</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    bindModalShell();
    document.getElementById('pickNewVisit').addEventListener('click', function(){ openPersonPickerForVisit(); });
    Array.prototype.slice.call(modalRoot.querySelectorAll('.pick-visit-btn')).forEach(function(btn){
      btn.addEventListener('click', function(){
        openReembPhotoStep(btn.dataset.personId, btn.dataset.visitId);
      });
    });
  }

  function openReembPhotoStep(personId, visitId){
    var person = db.people.filter(function(p){ return p.id === personId; })[0];
    var visit = person && person.visits.filter(function(v){ return v.id === visitId; })[0];
    if(!visit) return;
    modalRoot.innerHTML = '' +
    '<div class="modal-overlay" id="modalOverlay">' +
      '<div class="modal">' +
        '<div class="modal-header">Foto de la boleta o bono</div>' +
        '<div class="modal-body">' +
          '<div class="card-subtitle" style="margin-bottom:12px;">' + esc(person.name) + ' · ' + formatDate(visit.date) + (visit.specialty ? ' · ' + esc(visit.specialty) : '') + '</div>' +
          '<div style="display:flex;gap:8px;">' +
            '<button class="btn-secondary" id="reembCam" type="button" style="flex:1;">' + icon('camera', 16) + ' Cámara</button>' +
            '<button class="btn-secondary" id="reembGal" type="button" style="flex:1;">' + icon('image', 16) + ' Galería</button>' +
          '</div>' +
        '</div>' +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="reembBack" type="button">Volver</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    bindModalShell();
    document.getElementById('reembBack').addEventListener('click', openReembAddFlow);
    document.getElementById('reembCam').addEventListener('click', function(){
      currentPhotoTarget = { mode: 'reemb', personId: personId, visitId: visitId };
      photoInputCamera.value = '';
      photoInputCamera.click();
    });
    document.getElementById('reembGal').addEventListener('click', function(){
      currentPhotoTarget = { mode: 'reemb', personId: personId, visitId: visitId };
      photoInput.value = '';
      photoInput.click();
    });
  }

  function openReembolsoModal(personId, visitId, docId){
    var person = db.people.filter(function(p){ return p.id === personId; })[0];
    if(!person) return;
    var visit = person.visits.filter(function(v){ return v.id === visitId; })[0];
    if(!visit) return;
    var doc = (visit.documents || []).filter(function(d){ return d.id === docId; })[0];
    if(!doc) return;
    var r = doc.reembolso ? JSON.parse(JSON.stringify(doc.reembolso)) : defaultReembolso(person, doc.type, visit);

    function sectionHtml(key, title){
      var part = r[key];
      var opts = ['na', 'pendiente', 'enviado', 'reembolsado', 'rechazado'];
      return '' +
      '<div class="reemb-section">' +
        '<div class="reemb-section-title">' + esc(title) + '</div>' +
        '<label for="r-' + key + '-estado">Estado</label>' +
        '<select id="r-' + key + '-estado">' + opts.map(function(o){
          return '<option value="' + o + '"' + (part.estado === o ? ' selected' : '') + '>' + ESTADO_LABEL[o] + '</option>';
        }).join('') + '</select>' +
        '<div id="r-' + key + '-fecha-wrap">' +
          '<label for="r-' + key + '-fecha">Fecha de envío</label>' +
          '<input type="date" id="r-' + key + '-fecha" value="' + esc(part.fecha) + '">' +
        '</div>' +
        '<div id="r-' + key + '-monto-wrap">' +
          '<label for="r-' + key + '-monto">Monto reembolsado ($)</label>' +
          '<input type="number" inputmode="numeric" min="0" id="r-' + key + '-monto" value="' + esc(part.monto) + '" placeholder="Ej: 25000">' +
        '</div>' +
      '</div>';
    }

    modalRoot.innerHTML = '' +
    '<div class="modal-overlay" id="modalOverlay">' +
      '<div class="modal">' +
        '<div class="modal-header">Reembolso · ' + docLabel(doc.type) + '</div>' +
        '<div class="modal-body">' +
          '<div class="card-subtitle" style="margin-bottom:8px;">' + esc(person.name) + ' · ' + formatDate(visit.date) + (visit.specialty ? ' · ' + esc(visit.specialty) : '') + '</div>' +
          '<label for="r-tipo">Tipo de documento</label>' +
          '<select id="r-tipo"><option value="boleta"' + (doc.type === 'boleta' ? ' selected' : '') + '>Boleta (pagué todo, Isapre reembolsa)</option>' +
            '<option value="bono"' + (doc.type === 'bono' ? ' selected' : '') + '>Bono Isapre (Isapre pagó al momento)</option></select>' +
          '<label for="r-monto" id="r-monto-label">' + (doc.type === 'bono' ? 'Copago pagado ($)' : 'Monto de la boleta ($)') + '</label>' +
          '<input type="number" inputmode="numeric" min="0" id="r-monto" value="' + esc(r.monto) + '" placeholder="Ej: 45000">' +
          sectionHtml('prev', prevLabel(person)) +
          sectionHtml('seg', segLabel(person) + ' (complementario)') +
          (!person.seguro ? '<div class="reemb-hint">' + esc(person.name) + ' no tiene seguro registrado. Si tiene, agrégalo en su ficha (Inicio → lápiz) y quedará por defecto.</div>' : '') +
          '<div class="copago-box" id="r-copago"></div>' +
        '</div>' +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="modalCancel" type="button">Cancelar</button>' +
          '<button class="btn-primary" id="modalSave" type="button">Guardar</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    bindModalShell();

    function val(id){ return document.getElementById(id).value; }

    function readForm(){
      var out = { monto: val('r-monto') === '' ? '' : Number(val('r-monto')) };
      ['prev', 'seg'].forEach(function(k){
        var estado = val('r-' + k + '-estado');
        var monto = val('r-' + k + '-monto');
        out[k] = {
          estado: estado,
          fecha: (estado === 'na' || estado === 'pendiente') ? '' : val('r-' + k + '-fecha'),
          monto: (estado === 'reembolsado' && monto !== '') ? Number(monto) : ''
        };
      });
      return out;
    }

    function refresh(){
      ['prev', 'seg'].forEach(function(k){
        var estado = val('r-' + k + '-estado');
        document.getElementById('r-' + k + '-fecha-wrap').style.display = (estado === 'na' || estado === 'pendiente') ? 'none' : '';
        document.getElementById('r-' + k + '-monto-wrap').style.display = estado === 'reembolsado' ? '' : 'none';
      });
      var cp = reembCopago(readForm());
      document.getElementById('r-copago').textContent = cp === null ? 'Ingresa el monto de la boleta para calcular el copago' : 'Copago actual: ' + fmtCLP(cp);
    }

    ['prev', 'seg'].forEach(function(k){
      var sel = document.getElementById('r-' + k + '-estado');
      sel.addEventListener('change', function(){
        var fechaEl = document.getElementById('r-' + k + '-fecha');
        if(sel.value === 'enviado' && !fechaEl.value) fechaEl.value = todayStr();
        refresh();
      });
      document.getElementById('r-' + k + '-monto').addEventListener('input', refresh);
    });
    document.getElementById('r-monto').addEventListener('input', refresh);
    document.getElementById('r-tipo').addEventListener('change', function(){
      var t = val('r-tipo');
      var prevSel = document.getElementById('r-prev-estado');
      if(t === 'bono' && prevSel.value === 'pendiente') prevSel.value = 'na';
      if(t === 'boleta' && prevSel.value === 'na') prevSel.value = 'pendiente';
      document.getElementById('r-monto-label').textContent = t === 'bono' ? 'Copago pagado ($)' : 'Monto de la boleta ($)';
      refresh();
    });
    refresh();

    document.getElementById('modalSave').addEventListener('click', function(){
      var f = readForm();
      if(hasVal(f.monto) && reembRecuperado(f) > Number(f.monto)){
        alert('Lo reembolsado supera el monto de la boleta. Revisa los montos.');
        return;
      }
      if(f.seg.estado === 'enviado' && isOpenEstado(f.prev.estado)){
        if(!confirm('Normalmente el seguro pide la liquidación de la previsión primero, y la previsión aún no responde. ¿Guardar igual?')) return;
      }
      doc.type = val('r-tipo');
      if(doc.type === 'boleta'){
        var before = doc.reembolso ? doc.reembolso.prev.estado : null;
        if(f.prev.estado === 'na' && before !== 'na') learnRule(visit, true);
        if(f.prev.estado !== 'na' && before === 'na') learnRule(visit, false);
      }
      doc.reembolso = f;
      if(saveDB()){
        closeModal();
        render();
      }
    });
  }

  function openLightbox(dataUrl, filename){
    modalRoot.innerHTML = '' +
    '<div class="modal-overlay" id="modalOverlay">' +
      '<div class="lightbox">' +
        '<img src="' + dataUrl + '" class="lightbox-img" alt="Documento">' +
        '<div class="lightbox-actions">' +
          '<button class="btn-secondary" id="lightboxDownload" type="button">' + icon('download', 16) + ' Descargar</button>' +
          '<button class="btn-primary" id="lightboxClose" type="button">Cerrar</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    document.getElementById('lightboxClose').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', function(e){
      if(e.target.id === 'modalOverlay') closeModal();
    });
    document.getElementById('lightboxDownload').addEventListener('click', function(){
      var a = document.createElement('a');
      a.href = dataUrl;
      a.download = filename || 'documento.jpg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  }

  render();
})();
</script>
